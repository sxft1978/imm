name: ImmortalWrt_传包
on:
   workflow_dispatch:
    inputs:
      ssh_between:
        type: boolean
        description: '编译后 SSH 调试（是/否）'
        required: false
        default: false
      force_rebuild:
        description: '无视缓存纯净重编译'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  packages: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  WORK_PATH: /home/runner/work/imm/imm/
  SOURCE_DIR: openwrt
  CONFIG_FILE: config/imm_config/86_64.config
  FEEDS_CONF: feeds_config/immortalwrt.feeds.conf.default
  DIY_P1_SH: diy_script/immortalwrt_diy/diy-part1.sh
  DIY_P2_SH: diy_script/immortalwrt_diy/diy-part2.sh
  RELEASE_TAG: immortalwrt-X86
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_ARTIFACT: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Check Server Performance
        run: |
          echo "警告: 分配的服务器性能有限，若选择的插件过多，务 必注意CPU性能！"
          df -hT

      - name: Create Massive Swap Space
        run: |
          echo ">>> 正在创建 6GB Swap 虚拟内存..."
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 6G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://github.com/sxft1978/imm/raw/main/diy_script/immortalwrt_dependence)
          sudo chown $USER:$GROUPS $GITHUB_WORKSPACE
          sudo timedatectl set-timezone "$TZ"
          df -hT $PWD

      - name: Clone Source Code (Strict Path)
        run: |
          df -hT $PWD
          git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} ${{ github.workspace }}/${{ env.SOURCE_DIR }}

      - name: Load Custom Feeds (before cache key)
        run: |
          [ -e files ] && mv files openwrt/
          chmod +x $DIY_P1_SH
          cd openwrt
          ${{ github.workspace }}/$DIY_P1_SH
          df -hT
          cat -A feeds.conf
          
      - name: Update feeds
        run: |
          cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: |
          cd openwrt 
          ./scripts/feeds install -a
           ls ./feeds/packages/lang/

      - name: Load custom configuration
        run: |
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          ${{ github.workspace }}/$DIY_P2_SH 
          df -hT
          cat -A feeds.conf
          ls feeds/packages/lang/
   
      - name: Get architecture
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          TARGET_DEVICE_ARCH="$(grep "^CONFIG_TARGET_.*=y$" ".config" | head -n 1 | sed 's/^CONFIG_TARGET_//g' | sed 's/=y//g' | awk -F '_' '{print $1}')"
          echo "TARGET_DEVICE_ARCH=${TARGET_DEVICE_ARCH}" >>$GITHUB_ENV
          echo "MIXKEY=X86_64" >>$GITHUB_ENV
          
      - name: Setup Native SSH & Web Terminal
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ssh_between}}
        run: |
          sudo apt-get update
          sudo apt-get install -y curl iproute2                   
          # 下载 ttyd
          curl -L -o ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          chmod +x ttyd          
          echo "=== ttyd 版本 ==="
          ./ttyd --version          
          echo "=== 启动 ttyd ==="
          # 使用 nohup 确保后台运行不被 Actions 杀掉
          nohup ./ttyd -p 7681 -i 0.0.0.0 -W  -c "root:$SSH_PASSWORD" /bin/bash > /tmp/ttyd.log 2>&1 &
          sleep 3          
          echo "=== ttyd 日志 ==="
          cat /tmp/ttyd.log          
          echo "=== 端口检查 ==="
          ss -tlnp | grep 7681          
          echo "=== 本地访问测试 ==="
          curl -s -o /dev/null -w "HTTP 状态码: %{http_code}\n" http://127.0.0.1:7681          
          echo "=== 建立隧道 ==="
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64 
          # 5. 启动 Cloudflare Tunnel (同时暴露 Web 和 SSH)
          # 使用 nohup 确保后台运行
          ./cloudflared-linux-amd64 tunnel --no-autoupdate --url http://localhost:7681 2>&1 |  tee /tmp/tunnel.log &
          # 6. 等待隧道建立并提取地址
          echo "=== 等待隧道建立... ==="
          sleep 15          
          WEB_URL=$(grep -oP 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -n 1)         
          # 7. 连通性测试 (循环检测直到域名生效)
          if [ -n "$WEB_URL" ]; then
            echo "=== 检测域名连通性 ==="
            for i in {1..5}; do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $WEB_URL)
              if [ "$HTTP_CODE" != "000" ]; then
                echo "域名已生效! (HTTP状态码: $HTTP_CODE)"
                break
              fi
              echo "域名尚未生效，第 $i 次重试..."
              sleep 10
            done
          fi

          echo "========================================="
          echo "🚀 隧道已在后台启动！"
          echo "🌐 Web 终端地址: $WEB_URL"        
          echo "👤 Web 登录账号: root"
          echo "🔑 Web 登录密码: ${{ secrets.SSH_PASSWORD }}"
          echo "-----------------------------------------"
                    
          # 保持运行 1 小时
          sleep 10


      - name: Setup Native SSH & Web Terminal (Keep-Alive 修复版)
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ssh_between }}
        run: |
          # 全程失败不中断保活流程
          set +e

          # ===== 1. 安装依赖 =====
          sudo apt-get update
          sudo apt-get install -y curl iproute2 openssh-server wget

          # ===== 2. 配置并启动 SSH 服务 =====
          sudo mkdir -p /var/run/sshd
          echo 'PermitRootLogin yes' | sudo tee -a /etc/ssh/sshd_config
          echo 'PasswordAuthentication yes' | sudo tee -a /etc/ssh/sshd_config
          sudo dpkg-reconfigure openssh-server || true
          echo "root:${{ secrets.SSH_PASSWORD }}" | sudo chpasswd
          # -D 前台运行再放后台，nohup 防 step 切换被回收
          nohup sudo /usr/sbin/sshd -D > /tmp/sshd.log 2>&1 &

          # ===== 3. 下载并启动 ttyd (Web 终端) =====
          curl -L -o ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          chmod +x ttyd
          # 守护循环：ttyd 万一退出自动拉起（不退出就不会变）
          nohup bash -c 'while true; do ./ttyd -p 7681 -i 0.0.0.0 -W -c "root:$SSH_PASSWORD" /bin/bash; sleep 2; done' > /tmp/ttyd.log 2>&1 &

          # ===== 4. 下载 cloudflared =====
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64

          # ===== 5. 启动隧道（二选一） =====
          #
          # 【模式A：Quick Tunnel（你原来的写法）】
          #   优点：零配置、不要 CF 账号
          #   致命缺点：trycloudflare.com 域名是每次随机的临时域名，
          #             进程一旦重启，旧域名立即失效、换新域名——
          #             所以 Quick Tunnel 在原理上做不到“不失效”。
          #   只能靠下面的守护循环尽量不让它重启来延长寿命。
          #   注意：你原脚本启动了两条 cloudflared（一条只 ssh、一条 ssh+http），
          #         第一条还用了没安装的 cloudflared 命令——这是 bug，已删除。
          #         正确做法：一条进程同时暴露 ssh 和 http 两个 url。
          nohup bash -c 'while true; do ./cloudflared-linux-amd64 tunnel --no-autoupdate --url http://localhost:7681 --url ssh://localhost:22 >> /tmp/tunnel.log 2>&1; echo "[tunnel died, restart $(date)]" >> /tmp/tunnel.log; sleep 5; done' > /dev/null 2>&1 &

          # 【模式B：Named Tunnel（真正不失效，推荐长期用）】
          #   固定你自己的域名，断了重连域名也不变，真正做到不失效。
          #   前提：CF 账号 + 一个域名，先在本地跑一次建好 tunnel 拿到 TUNNEL_ID，
          #         把凭据塞进 secrets。需要时取消下面注释、并注释掉模式A。
          # echo "${{ secrets.CLOUDFLARE_CRED_JSON }}" > /tmp/cf-cred.json
          # ./cloudflared-linux-amd64 tunnel --no-autoupdate run "${{ secrets.TUNNEL_ID }}" > /tmp/tunnel.log 2>&1 &

          # ===== 6. 等待隧道建立并提取地址 =====
          echo "=== 等待隧道建立... ==="
          sleep 15
          WEB_URL=$(grep -oP 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -n 1)

          # ===== 7. 连通性检测 =====
          if [ -n "$WEB_URL" ]; then
            echo "=== 检测域名连通性 ==="
            for i in {1..5}; do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $WEB_URL)
              if [ "$HTTP_CODE" != "000" ]; then
                echo "域名已生效! (HTTP: $HTTP_CODE)"; break
              fi
              echo "域名尚未生效，第 $i 次重试..."; sleep 5
            done
          fi

          echo "========================================="
          echo "Web 终端地址: $WEB_URL"
          echo "SSH 临时域名: $(echo $WEB_URL | sed 's/https:\/\///')"
          echo "用户名: root  密码: (SSH_PASSWORD secret)"
          echo "-----------------------------------------"
          echo "提示: Quick Tunnel 域名每次重启会变；要彻底不失效请用模式B命名隧道。"
          echo "========================================="

          # ===== 8. 保活：让 job 一直挂着，隧道进程就不被回收 =====
          #   原来只 sleep 3600，1 小时后本 step 结束 -> job 结束 -> 隧道被杀。
          #   改成无限循环，直到你在 Actions 页面手动 Cancel 这次运行。
          #   自建 runner（你这套 self-hosted）没有免费 6 小时硬上限，可长期挂。
          echo "会话保持中（在 Actions 页面 Cancel 工作流才会断开）..."
          while true; do
            CUR=$(grep -oP 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | tail -n 1)
            echo "[$(date '+%F %T')] 当前地址: $CUR  存活隧道进程数: $(pgrep -c cloudflared)"
            sleep 300
          done

          
      - name: 开启 SSH 服务 (Start SSH service)
        #uses: mxschmitt/action-tmate@v3.24
        #if: ${{ github.event_name == 'workflow_dispatch' && inputs.ssh_between}}
        uses: lhotari/action-upterm@v1
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ssh_between}}
        with:
          wait-timeout-minutes: 2

      - name: Copy config
        run: |
          cd openwrt
          cp .config  imm.config
          ls -la
           

      - name: Download package
        id: package
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;
          df -hT $PWD

      - name: Check space usage
        if: (!cancelled())
        run: df -hT

      - name: Upload DL folder to Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-x86-dl
          path: ${{ github.workspace }}/openwrt/dl
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6
          
        
      - name: upload config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-x86-config
          path: ${{ github.workspace }}/openwrt/imm.config
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6

      # ============================================================
      # 第二阶段: 打包并上传整个 openwrt 目录到 Release
      # ============================================================
      - name: Package openwrt folder
        run: |
          echo "正在检查并打包 openwrt 目录..."
          ls -la $GITHUB_WORKSPACE/$SOURCE_DIR
          cd openwrt
          tar -czvf ../openwrt.tar.gz .
          split -b 1200M ../openwrt.tar.gz ../openwrt-part-
          echo ">>> 分割后的分片列表："
          ls -lh ../openwrt-part-*

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${RELEASE_TAG}-$(date +%Y%m%d)"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            i=1
            while git rev-parse "${TAG}-${i}" >/dev/null 2>&1; do
              i=$((i + 1))
            done
            TAG="${TAG}-${i}"
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Create Release and upload openwrt
        uses: ncipollo/release-action@v1
        with:
          artifacts: "openwrt-part-*"
          tag: ${{ env.TAG }}
          name: "ImmortalWrt_${{ env.SOURCE_DIR }}_X86_64"
          body: "自动编译的固件包"
          allowUpdates: true
