name: ImmortalWrt_传包
on:
  workflow_dispatch:
  #push:
    #branches: [ main ]

permissions:
  contents: write
  actions: write
  packages: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  WORK_PATH: /home/runner/work/imm/imm/
  SOURCE_DIR: openwrt
  CONFIG_FILE: config/imm_config/86_64.config
  FEEDS_CONF: feeds_config/immortalwrt.feeds.conf.default
  DIY_P1_SH: diy_script/immortalwrt_diy/diy-part1.sh
  DIY_P2_SH: diy_script/immortalwrt_diy/diy-part2.sh
  RELEASE_TAG: immortalwrt-X86
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_ARTIFACT: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  FORTIFY_FLAGS: "-fno-stack-protector -U_FORTIFY_SOURCE"

jobs:
  # ============================================================
  # 第一阶段: 环境准备 & 编译工具链 (Toolchain)
  # ============================================================
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Check Server Performance
        run: |
          echo "警告: 分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          df -hT

      - name: Create Massive Swap Space
        run: |
          echo ">>> 正在创建 6GB Swap 虚拟内存..."
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 6G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://github.com/sxft1978/imm/raw/main/diy_script/immortalwrt_dependence)
          sudo chown $USER:$GROUPS $GITHUB_WORKSPACE
          sudo timedatectl set-timezone "$TZ"
          df -hT $PWD

      - name: Clone Source Code (Strict Path)
        # working-directory: ${{ github.workspace }}
        run: |
          df -hT $PWD
          git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} ${{ github.workspace }}/${{ env.SOURCE_DIR }}
          # ln -sf ${{ github.workspace }}/${{ env.SOURCE_DIR }} $GITHUB_WORKSPACE/openwrt

      - name: Load Custom Feeds (before cache key)
        run: |
          #[ -e $FEEDS_CONF ] && cp $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          ${{ github.workspace }}/$DIY_P1_SH
          df -hT

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          # [ -e files ] && mv files openwrt/files
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          # chmod +x $DIY_P2_SH
          #cd openwrt
          #$GITHUB_WORKSPACE/$DIY_P2_SH
          #df -hT
          #make defconfig

      - name: Get architecture
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          TARGET_DEVICE_ARCH="$(grep "^CONFIG_TARGET_.*=y$" ".config" | head -n 1 | sed 's/^CONFIG_TARGET_//g' | sed 's/=y//g' | awk -F '_' '{print $1}')"
          echo "TARGET_DEVICE_ARCH=${TARGET_DEVICE_ARCH}" >>$GITHUB_ENV
          echo "MIXKEY=X86_64" >>$GITHUB_ENV

      - name: Download package
        id: package
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;
          df -hT $PWD

      - name: Check space usage
        if: (!cancelled())
        run: df -hT

      # [改动] 编译完成后始终上传 DL 目录，方便后续复用
      - name: Upload DL folder to Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-x86-dl
          path: ${{ github.workspace }}/openwrt/dl
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6

      # ============================================
      # 第二阶段: 打包并上传整个 openwrt 目录到 Release
      # ============================================
      - name: Package openwrt folder
        run: |
          echo "正在检查并打包 openwrt 目录..."
          ls -la $GITHUB_WORKSPACE/$SOURCE_DIR
          $pwd
          cd openwrt
          ls
          tar -czvf ../openwrt-backup.tar.gz --exclude='.git' --exclude='dl'

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${RELEASE_TAG}-$(date +%Y%m%d)"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            i=1
            while git rev-parse "${TAG}-${i}" >/dev/null 2>&1; do
              i=$((i + 1))
            done
            TAG="${TAG}-${i}"
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Create Release and upload openwrt package
        if: env.UPLOAD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: openwrt.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true

