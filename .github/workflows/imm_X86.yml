name: ImmortalWrt Build (Two-Stage with Toolchain Cache)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write
  packages: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  SOURCE_DIR: openwrt
  CONFIG_FILE: config/imm_config/X86.config
  FEEDS_CONF: feeds_config/immortalwrt.feeds.conf.default
  DIY_P1_SH: diy_script/immortalwrt_diy/diy-part1.sh
  DIY_P2_SH: diy_script/immortalwrt_diy/diy-part2.sh
  RELEASE_TAG: immortalwrt-X86
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_ARTIFACT: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  # ============================================
  # 第一阶段: 环境准备 & 编译工具链 (Toolchain)
  # ============================================
  build-toolchain:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://github.com/sxft1978/imm/raw/main/diy_script/immortalwrt_dependence)
          sudo chown $USER:$GROUPS $GITHUB_WORKSPACE
          sudo timedatectl set-timezone "$TZ"

      # 源码直接克隆到 $GITHUB_WORKSPACE/openwrt（修复点1: 去掉软链接）
      - name: Clone Source Code
        run: |
          git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} ${{ env.SOURCE_DIR }}

      # 覆盖自定义 feeds（必须在计算缓存 key 之前完成）
      - name: Load Custom Feeds
        run: |
          cp $FEEDS_CONF ${{ env.SOURCE_DIR }}/feeds.conf.default

      # 生成 .config（修复点2: key 依赖 .config 哈希）
      - name: Prepare Config
        run: |
          cp $CONFIG_FILE ${{ env.SOURCE_DIR }}/.config
          cd ${{ env.SOURCE_DIR }}
          make defconfig

      # 缓存 key = feeds.conf.default + .config 的哈希（修复点2）
      - name: Compute Cache Key
        id: cache_key
        run: |
          echo "key=immortalwrt-toolchain-${{ runner.os }}-${{ hashFiles('openwrt/feeds.conf.default', 'openwrt/.config') }}" >> $GITHUB_OUTPUT

      # 只缓存 toolchain 目录，不缓存整个 staging_dir（修复点4）
      - name: Restore Toolchain Cache
        id: restore_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.SOURCE_DIR }}/dl
            ${{ env.SOURCE_DIR }}/staging_dir/toolchain-*
            ${{ env.SOURCE_DIR }}/.ccache
          key: ${{ steps.cache_key.outputs.key }}

      - name: Update feeds
        run: cd ${{ env.SOURCE_DIR }} && ./scripts/feeds update -a

      - name: Install feeds
        run: cd ${{ env.SOURCE_DIR }} && ./scripts/feeds install -a

      # 只有缓存未命中时才编译工具链（修复点5）
      - name: Compile Toolchain Only
        if: steps.restore_cache.outputs.cache-hit != 'true'
        run: |
          cd ${{ env.SOURCE_DIR }}
          export TARGET_CFLAGS="-fno-stack-protector -U_FORTIFY_SOURCE"
          export TARGET_CPPFLAGS="-U_FORTIFY_SOURCE"
          make -j1 V=s toolchain/install

      # 只有未命中且编译成功时才保存缓存（修复点5）
      - name: Save Toolchain Cache
        if: steps.restore_cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.SOURCE_DIR }}/dl
            ${{ env.SOURCE_DIR }}/staging_dir/toolchain-*
            ${{ env.SOURCE_DIR }}/.ccache
          key: ${{ steps.cache_key.outputs.key }}

  # ============================================
  # 第二阶段: 编译完整固件 (Target)
  # ============================================
  build-firmware:
    needs: build-toolchain
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://github.com/sxft1978/imm/raw/main/diy_script/immortalwrt_dependence)
          sudo chown $USER:$GROUPS $GITHUB_WORKSPACE
          sudo timedatectl set-timezone "$TZ"

      - name: Clone Source Code
        run: |
          git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} ${{ env.SOURCE_DIR }}

      - name: Load Custom Feeds
        run: |
          cp $FEEDS_CONF ${{ env.SOURCE_DIR }}/feeds.conf.default

      # 与第一阶段完全相同的 key 计算逻辑
      - name: Prepare Config
        run: |
          cp $CONFIG_FILE ${{ env.SOURCE_DIR }}/.config
          cd ${{ env.SOURCE_DIR }}
          make defconfig

      - name: Compute Cache Key
        id: cache_key
        run: |
          echo "key=immortalwrt-toolchain-${{ runner.os }}-${{ hashFiles('openwrt/feeds.conf.default', 'openwrt/.config') }}" >> $GITHUB_OUTPUT

      # 恢复第一阶段保存的工具链缓存（修复点3: 去掉 restore-keys）
      - name: Restore Toolchain Cache
        id: restore_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.SOURCE_DIR }}/dl
            ${{ env.SOURCE_DIR }}/staging_dir/toolchain-*
            ${{ env.SOURCE_DIR }}/.ccache
          key: ${{ steps.cache_key.outputs.key }}

      # 验证缓存是否可用（修复点6）
      - name: Validate Toolchain Cache
        if: steps.restore_cache.outputs.cache-hit == 'true'
        run: |
          if [ ! -d "${{ env.SOURCE_DIR }}/staging_dir/toolchain-*" ]; then
            echo ">>> 缓存损坏，删除并重新编译工具链"
            rm -rf ${{ env.SOURCE_DIR }}/staging_dir/toolchain-*
            rm -rf ${{ env.SOURCE_DIR }}/.ccache
            echo "cache_valid=false" >> $GITHUB_ENV
          else
            echo ">>> 工具链缓存有效"
            echo "cache_valid=true" >> $GITHUB_ENV
          fi

      - name: Update feeds
        run: cd ${{ env.SOURCE_DIR }} && ./scripts/feeds update -a

      - name: Install feeds
        run: cd ${{ env.SOURCE_DIR }} && ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          mv files ${{ env.SOURCE_DIR }}/files
          mv $CONFIG_FILE ${{ env.SOURCE_DIR }}/.config
          chmod +x $DIY_P2_SH
          cd ${{ env.SOURCE_DIR }}
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: Download package
        id: package
        run: |
          cd ${{ env.SOURCE_DIR }}
          make defconfig
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      # 缓存无效时重新编译工具链（修复点6）
      - name: Compile Toolchain (if cache invalid)
        if: env.cache_valid == 'false'
        run: |
          cd ${{ env.SOURCE_DIR }}
          export TARGET_CFLAGS="-fno-stack-protector -U_FORTIFY_SOURCE"
          export TARGET_CPPFLAGS="-U_FORTIFY_SOURCE"
          make -j1 V=s toolchain/install

      - name: Compile the firmware
        id: compile
        run: |
          cd ${{ env.SOURCE_DIR }}
          export TARGET_CFLAGS="-fno-stack-protector -U_FORTIFY_SOURCE"
          export TARGET_CPPFLAGS="-U_FORTIFY_SOURCE"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd ${{ env.SOURCE_DIR }}/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          echo "release_tag=$RELEASE_TAG-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        uses: ncipollo/release-action@v1.14.0
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ steps.tag.outputs.release_tag }}
          bodyFile: "release.txt"
          artifacts: ${{ env.FIRMWARE }}/*

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v0.1.0
        with:
          retain_days: 0
          keep_minimum_runs: 2

      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.3
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
