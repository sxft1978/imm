name: Build ImmortalWrt 24.10 (Two-Stage with Toolchain Cache)

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: .config
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build-toolchain:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone ImmortalWrt source
        run: |
          git clone -b $REPO_BRANCH --single-branch $REPO_URL source
          cd source
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate toolchain config
        run: |
          cd source
          cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
          make defconfig

      - name: Build toolchain
        run: |
          cd source
          make toolchain/install -j$(nproc)

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: source/staging_dir
          key: toolchain-${{ hashFiles('source/.config') }}-${{ github.run_id }}
          restore-keys: |
            toolchain-${{ hashFiles('source/.config') }}-

  build-firmware:
    needs: build-toolchain
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone ImmortalWrt source
        run: |
          git clone -b $REPO_BRANCH --single-branch $REPO_URL source
          cd source
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Restore toolchain cache
        uses: actions/cache@v4
        with:
          path: source/staging_dir
          key: toolchain-${{ hashFiles('source/.config') }}-${{ github.run_id }}
          restore-keys: |
            toolchain-${{ hashFiles('source/.config') }}-

      - name: Generate config
        run: |
          cd source
          cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
          make defconfig

      - name: Download package
        run: |
          cd source
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Build firmware
        run: |
          cd source
          make -j$(nproc) || make -j1 V=s

      - name: Organize files
        id: organize
        run: |
          cd source/bin/targets/*/*
          echo "::set-output name=status::success"
          ls -lh

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v1
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          files: |
            source/bin/targets/*/*/*.gz
            source/bin/targets/*/*/*.xz
          name: ImmortalWrt ${{ env.REPO_BRANCH }}
          body: |
            Auto build by GitHub Actions
          draft: false
          prerelease: false

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v0.1.0
        with:
          keep_minimum_runs: 2
          retain_days: 0

      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.3
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
