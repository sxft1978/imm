# ============================================================
# Multi-Source Tiered Cache Build
# 多源码三级缓存编译工作流（定稿版）
#
# 缓存体系：
#   Tier1 (dl)        - 源码包下载目录，通过 actions/cache 存储
#   Tier2 (toolchain) - 交叉编译工具链，通过 actions/cache 存储
#   Tier3 (target)    - 目标设备编译产物，通过 Docker 镜像存储到 GHCR
#
# 触发方式：手动触发（workflow_dispatch）
# 数据来源：矩阵由 scripts/build_matrix.sh 动态生成，加设备只改脚本
# ============================================================

name: Multi-Source Tiered Cache Build

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '是否强制清理缓存重新编译（忽略所有缓存）'
        required: false
        default: false
        type: boolean

# 全局环境变量
env:
  WORKSPACE: /workdir                # 统一使用大磁盘挂载目录，避免 GitHub Runner 默认磁盘空间不足
  UPLOAD_FIRMWARE: true              # 是否将固件上传到 Actions 产物
  UPLOAD_RELEASE: true               # 编译完成后是否自动发布到 GitHub Release

permissions:
  contents: write                    # 允许写入仓库内容（用于 Release 发布）
  packages: write                    # 允许推送容器镜像到 GHCR
  actions: write                     # 允许管理 Actions 缓存

jobs:
  # ========== 第一步：从脚本生成编译矩阵 ==========
  generate-matrix:
    runs-on: ubuntu-22.04
    outputs:
      # 将脚本输出的 JSON 数组作为矩阵数据传递给下游 job
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      # 签出仓库，获取 scripts/build_matrix.sh
      - uses: actions/checkout@v4

      # 执行脚本，将输出转为紧凑 JSON 格式，写入 GITHUB_OUTPUT
      - id: set-matrix
        run: |
          chmod +x scripts/build_matrix.sh
          #echo "matrix=$(scripts/build_matrix.sh | jq -c '.')" >> "$GITHUB_OUTPUT"
          printf "matrix=%s\n" "$(scripts/build_matrix.sh | jq -c '.')" >> "$GITHUB_OUTPUT"

  # ========== 第二步：并行编译所有目标设备 ==========
  build:
    needs: generate-matrix           # 依赖上一步生成的矩阵数据
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false               # 一个设备编译失败，不中止其他设备的并行任务
      max-parallel: 3                # 限制最大并行数，避免磁盘 IO 竞争
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ env.WORKSPACE }}

    steps:
      # Step 1: 迁移 Docker 数据目录并初始化大磁盘工作空间
      # GitHub Runner 默认根分区空间有限（约 14GB），编译 OpenWrt 容易爆盘
      # 将 Docker 数据目录迁移到 /workdir（通常有 80GB+ 可用空间）
      - name: Relocate Docker & Workspace
        run: |
          sudo mkdir -p /workdir
          sudo chown runner:runner /workdir
          echo "DOCKER_OPTS=--data-root /workdir/docker" | sudo tee -a /etc/default/docker
          sudo systemctl restart docker
          # 等待 Docker 守护进程就绪，避免后续 login/build 失败
          for i in $(seq 1 10); do
            sudo docker info >/dev/null 2>&1 && break
            sleep 2
          done
          echo "DISK_FREE_SPACE=$(df /workdir --output=avail -h | tail -1)" >> $GITHUB_ENV

      # Step 2: 登录 GitHub Container Registry (GHCR)
      # 用于后续将 Tier3 编译产物打包为 Docker 镜像推送
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: 签出配置仓库（包含 .config 配置文件和 Shell 脚本）
      - name: Checkout Config & Scripts
        uses: actions/checkout@v4
        with:
          path: repo                 # 签出到 repo 子目录，避免和源码目录冲突

      # Step 4: 克隆目标固件源码
      # 使用 --depth 1 浅克隆，节省时间和磁盘空间
      - name: Clone Source (${{ matrix.name }})
        run: |
          git clone --depth 1 -b ${{ matrix.REPO_BRANCH }} ${{ matrix.REPO_URL }} ${{ matrix.DEVICE }}
          chmod +x repo/scripts/cache_tiered.sh

      # Step 5: 计算第一层缓存（dl 源码包目录）的指纹
      # 指纹基于 dl 目录下所有文件的文件名和大小生成，用于判断源码包是否有变化
      - name: Fingerprint Tier1 (dl) - ${{ matrix.name }}
        if: ${{ !inputs.force_rebuild }}
        run: |
          cd ${{ env.WORKSPACE }}/${{ matrix.DEVICE }}/dl
          bash ${{ env.WORKSPACE }}/repo/scripts/cache_tiered.sh fp tier1
        id: fp_tier1

      # Step 6: 还原第一层缓存（dl 源码包）
      # 如果指纹匹配，直接恢复之前下载的源码包，跳过重复下载
      - name: Restore Tier1 Cache - ${{ matrix.name }}
        if: ${{ !inputs.force_rebuild }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORKSPACE }}/${{ matrix.DEVICE }}/dl
          key: dl-${{ matrix.ARCH }}-${{ matrix.REPO_BRANCH }}-${{ steps.fp_tier1.outputs.fp_tier1 }}
          restore-keys: |
            dl-${{ matrix.ARCH }}-${{ matrix.REPO_BRANCH }}-

      # Step 7: 计算第二层缓存（交叉编译工具链）的指纹
      # 指纹基于 host 工具链和 staging_dir/host 目录生成
      - name: Fingerprint Tier2 (toolchain) - ${{ matrix.name }}
        if: ${{ !inputs.force_rebuild }}
        run: |
          cd ${{ env.WORKSPACE }}/${{ matrix.DEVICE }}
          bash ${{ env.WORKSPACE }}/repo/scripts/cache_tiered.sh fp tier2
        id: fp_tier2

      # Step 8: 还原第二层缓存（工具链）
      # 恢复之前编译好的 host 工具和交叉编译工具链，避免重复编译
      - name: Restore Tier2 Cache - ${{ matrix.name }}
        if: ${{ !inputs.force_rebuild }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WORKSPACE }}/${{ matrix.DEVICE }}/build_dir/host
            ${{ env.WORKSPACE }}/${{ matrix.DEVICE }}/build_dir/hostpkg
            ${{ env.WORKSPACE }}/${{ matrix.DEVICE }}/staging_dir/host
            ${{ env.WORKSPACE }}/${{ matrix.DEVICE }}/staging_dir/hostpkg
          key: toolchain-${{ matrix.ARCH }}-${{ matrix.REPO_BRANCH }}-${{ steps.fp_tier2.outputs.fp_tier2 }}
          restore-keys: |
            toolchain-${{ matrix.ARCH }}-${{ matrix.REPO_BRANCH }}-

      # Step 9: 还原自动编译进度标记 & 加载 .config 配置文件
      # 先还原之前保存的编译进度（如果有），再覆盖项目的 .config 配置文件
      # 最后执行 make defconfig 确保配置生效
      - name: Restore Auto & Defconfig - ${{ matrix.name }}
        working-directory: ${{ env.WORKSPACE }}/${{ matrix.DEVICE }}
        run: |
          bash ${{ env.WORKSPACE }}/repo/scripts/cache_tiered.sh restore auto
          cp ${{ env.WORKSPACE }}/repo/${{ matrix.CONFIG_FILE }} .config
          make defconfig

      # Step 10: 编译基础工具和交叉编译工具链
      # 编译前创建一个时间戳标记文件，后续用于判断哪些文件是新编译产生的
      - name: Compile Base & Tools - ${{ matrix.name }}
        working-directory: ${{ env.WORKSPACE }}/${{ matrix.DEVICE }}
        run: |
          touch .compile_marker_base   # 建立基准时间标记，用于后续判断 Tier2/Tier3 变动
          make tools/compile toolchain/compile -j$(nproc)

      # Step 11: 提前下载所有软件包源码
      # 使用 timeout 限制下载时间，避免网络问题导致长时间卡住
      # continue-on-error: true 确保下载失败不中断编译流程
      - name: Download Packages - ${{ matrix.name }}
        working-directory: ${{ env.WORKSPACE }}/${{ matrix.DEVICE }}
        continue-on-error: true
        run: timeout 25m make download -j$(nproc) || true

      # Step 12: 正式编译固件
      # 先尝试普通编译，失败后自动切换 V=s 详细模式重新编译（便于排查问题）
      - name: Compile Firmware - ${{ matrix.name }}
        working-directory: ${{ env.WORKSPACE }}/${{ matrix.DEVICE }}
        run: make -j$(nproc) || make -j$(nproc) V=s

      # Step 13: 检测第二层（工具链）是否有变动
      # 对比编译前后 staging_dir/host/stamp 目录的变化，判断工具链是否重新编译
      - name: Gate Tier2 - ${{ matrix.name }}
        working-directory: ${{ env.WORKSPACE }}/${{ matrix.DEVICE }}
        run: bash ${{ env.WORKSPACE }}/repo/scripts/cache_tiered.sh gate tier2
        id: gate_tier2

      # Step 14: 如果第二层有变动，则保存新的工具链缓存
      # 只有当工具链确实重新编译时，才更新缓存，避免无效写入
      - name: Save Tier2 Cache - ${{ matrix.name }}
        if: ${{ !inputs.force_rebuild && steps.gate_tier2.outputs.changed_tier2 != '0' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.WORKSPACE }}/${{ matrix.DEVICE }}/build_dir/host
            ${{ env.WORKSPACE }}/${{ matrix.DEVICE }}/build_dir/hostpkg
            ${{ env.WORKSPACE }}/${{ matrix.DEVICE }}/staging_dir/host
            ${{ env.WORKSPACE }}/${{ matrix.DEVICE }}/staging_dir/hostpkg
          key: toolchain-${{ matrix.ARCH }}-${{ matrix.REPO_BRANCH }}-${{ steps.fp_tier2.outputs.fp_tier2 }}

      # Step 15: 检测第三层（目标设备编译产物）是否有变动
      # 对比 build_dir/target-* 和 staging_dir/target-* 的 stamp 文件变化
      - name: Gate Tier3 - ${{ matrix.name }}
        working-directory: ${{ env.WORKSPACE }}/${{ matrix.DEVICE }}
        run: bash ${{ env.WORKSPACE }}/repo/scripts/cache_tiered.sh gate tier3
        id: gate_tier3

      # Step 16: 如果第三层有变动，则打包为 Docker 镜像推送到 GHCR
      # 将目标设备的编译产物打包为镜像，作为 Tier3 缓存保存
      - name: Pack & Push Tier3 - ${{ matrix.name }}
        if: ${{ !inputs.force_rebuild && steps.gate_tier3.outputs.changed_tier3 != '0' }}
        working-directory: ${{ env.WORKSPACE }}/${{ matrix.DEVICE }}
        run: |
          export ARCH="${{ matrix.ARCH }}"
          export TIER3_IMAGE="ghcr.io/${{ github.repository }}/${{ matrix.DEVICE }}"
          export GITHUB_REPOSITORY="${{ github.repository }}"
          export GITHUB_SHA="${{ github.sha }}"
          bash ${{ env.WORKSPACE }}/repo/scripts/cache_tiered.sh pack tier3

      # Step 17: 将编译好的固件上传到 GitHub Actions 产物
      # 保留 5 天，方便手动下载测试；如果没有生成固件文件则只警告不报错
      - name: Upload Firmware Artifact - ${{ matrix.name }}
        if: env.UPLOAD_FIRMWARE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-firmware
          path: ${{ env.WORKSPACE }}/${{ matrix.DEVICE }}/bin/targets/*/*/*
          retention-days: 5
          if-no-files-found: warn

      # Step 18: 发布固件到 GitHub Release
      # 自动创建 Release 标签，将固件文件附加到 Release 页面供下载
      - name: Publish GitHub Release - ${{ matrix.name }}
        if: env.UPLOAD_RELEASE == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.WORKSPACE }}/${{ matrix.DEVICE }}/bin/targets/*/*/*
          tag_name: ${{ matrix.RELEASE_TAG || format('{0}_{1}', matrix.DEVICE, github.run_id) }}
          draft: false
          prerelease: false
