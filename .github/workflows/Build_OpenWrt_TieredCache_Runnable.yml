# =============================================================
# .github/workflows/build.yml
# OpenWrt x86_64 编译 + 分层缓存 (配合 scripts/cache_tiered_x86.sh)
#
# 本轮已落地的改动:
#   1. tier2 / tier3 缓存 key = 输入指纹 (fp_tier1-fp_config-fp_patches)
#      严格绑定 下载的源码 + 配置 + 补丁, 任何一处不同就 miss 重编, 绝不错配
#   2. 打包/解压在脚本侧已改 zstd -T0 满核
#   3. dl 回拨 2000 年在脚本 restore auto 内
#   4. ccache 整段用 # 注释, 需要时去掉注释即可启用
# =============================================================
name: Build OpenWrt x86_64 (tiered cache)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  SRC_DIR: ${{ github.workspace }}/openwrt
  CACHE_ROOT: ${{ github.workspace }}/.cache
  OUTPUT_DIR: ${{ github.workspace }}/.cache/tiered
  MARKER_DIR: ${{ github.workspace }}/.cache/stamp
  REGISTRY: ghcr.io/${{ github.repository }}/openwrt-cache

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd docker.io

      - name: 计算缓存指纹
        id: fp
        run: |
          echo "fp_tier1=$(bash scripts/cache_tiered_x86.sh fp tier1)"    >> $GITHUB_OUTPUT
          echo "fp_tier2=$(bash scripts/cache_tiered_x86.sh fp tier2)"    >> $GITHUB_OUTPUT
          echo "fp_tier3=$(bash scripts/cache_tiered_x86.sh fp tier3)"    >> $GITHUB_OUTPUT
          echo "fp_config=$(bash scripts/cache_tiered_x86.sh fp config)"   >> $GITHUB_OUTPUT
          echo "fp_patches=$(bash scripts/cache_tiered_x86.sh fp patches)" >> $GITHUB_OUTPUT

      # ---------- 从 actions/cache 拉回归档 (缓存的是 tar.zst, 不是源码目录) ----------
      - name: 恢复 dl 层缓存 (tier1)
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.OUTPUT_DIR }}/tier1
          key: tier1-${{ steps.fp.outputs.fp_tier1 }}

      - name: 恢复工具链层缓存 (tier2)
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.OUTPUT_DIR }}/tier2
          # 旧: key: tier2-${{ steps.fp.outputs.fp_tier2 }}
          # 新: 用输入指纹(源码+配置+补丁)拼 key, 严格对应源码
          key: tier2-${{ steps.fp.outputs.fp_tier1 }}-${{ steps.fp.outputs.fp_config }}-${{ steps.fp.outputs.fp_patches }}

      - name: 恢复 target 包层缓存 (tier3)
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.OUTPUT_DIR }}/tier3
          # 旧: key: tier3-${{ steps.fp.outputs.fp_tier3 }}
          # 新: 同样用输入指纹
          key: tier3-${{ steps.fp.outputs.fp_tier1 }}-${{ steps.fp.outputs.fp_config }}-${{ steps.fp.outputs.fp_patches }}

      # ---------- 解归档到源码树 + dl 时间戳回拨 (脚本 auto 内完成) ----------
      - name: 还原缓存到源码树 (含 dl 回拨 2000)
        run: bash scripts/cache_tiered_x86.sh restore auto

      # ---------- restore 之后、make 之前, 给每层打 marker 基准 ----------
      # 顺序: restore -> (dl touch 回拨) -> marker -> make -> gate
      - name: 打 marker 基准
        run: for t in tier1 tier2 tier3; do bash scripts/cache_tiered_x86.sh marker "$t"; done

      # ========== 4) ccache 加速 (需要时去掉整段注释即可启用) ==========
      # - name: 配置 ccache
      #   run: |
      #     echo "CONFIG_CCACHE=y" >> $SRC_DIR/.config
      #     cd $SRC_DIR && make defconfig
      #     echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
      #     echo "CCACHE_MAXSIZE=2G" >> $GITHUB_ENV
      #     echo "CCACHE_SLOPPINESS=time_macros,file_macro,include_file_mtime,include_file_ctime" >> $GITHUB_ENV
      #     echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
      #     echo "CCACHE_HASHDIR=false" >> $GITHUB_ENV
      #
      # - name: 恢复 ccache 缓存
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.ccache
      #     key: ccache-x86_64-${{ github.run_id }}
      #     restore-keys: |
      #       ccache-x86_64-
      #
      # - name: ccache 统计(编译前)
      #   run: ccache -s
      # ==============================================================

      - name: 编译固件
        working-directory: ${{ env.SRC_DIR }}
        run: |
          make download -j"$(nproc)" || true
          make -j"$(nproc)" || make -j1 V=s

      # ========== ccache 统计(编译后, 与上面同步启用/注释) ==========
      # - name: ccache 统计(编译后)
      #   run: ccache -s
      # ==============================================================

      # ---------- gate 判每层是否真变化, 变了才重打包 ----------
      - name: 判定并重新打包变化的层
        id: gate
        run: |
          for t in tier1 tier2 tier3; do
            c=$(bash scripts/cache_tiered_x86.sh gate "$t")
            echo "[gate] $t changed=$c"
            if [ "$c" = "1" ]; then
              bash scripts/cache_tiered_x86.sh pack "$t"
              echo "CHANGED_$t=1" >> $GITHUB_ENV
            else
              echo "CHANGED_$t=0" >> $GITHUB_ENV
            fi
          done

      # ---------- 把变化的层的新归档写回 actions/cache ----------
      - name: 保存 dl 层缓存 (tier1)
        if: env.CHANGED_tier1 == '1'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.OUTPUT_DIR }}/tier1
          key: tier1-${{ steps.fp.outputs.fp_tier1 }}

      - name: 保存工具链层缓存 (tier2)
        if: env.CHANGED_tier2 == '1'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.OUTPUT_DIR }}/tier2
          key: tier2-${{ steps.fp.outputs.fp_tier1 }}-${{ steps.fp.outputs.fp_config }}-${{ steps.fp.outputs.fp_patches }}

      - name: 保存 target 包层缓存 (tier3)
        if: env.CHANGED_tier3 == '1'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.OUTPUT_DIR }}/tier3
          key: tier3-${{ steps.fp.outputs.fp_tier1 }}-${{ steps.fp.outputs.fp_config }}-${{ steps.fp.outputs.fp_patches }}

      # ---------- 大层双通道: 变化时把归档推 GHCR (可选, actions/cache 已兜底) ----------
      - name: 登录 GHCR
        if: env.CHANGED_tier3 == '1'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送大层归档到 GHCR
        if: env.CHANGED_tier3 == '1'
        run: bash scripts/cache_tiered_x86.sh image tier3 || true

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86_64
          path: ${{ env.SRC_DIR }}/bin/targets/
          if-no-files-found: ignore
