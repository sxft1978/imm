###############################################################################
# OpenWrt 三层分级缓存编译工作流 —— 【填实可跑版 runnable】
#
# 这一版把之前"占位"的 DEVICE / ARCH / TIER3_PATHS 全部换成真实三元组，
# 并且按「设备型号」做成矩阵（include），一次触发即可并行编多款设备。
#
# 三个值现在到底是什么关系（这是本版的重点）：
#   ARCH     = 宽泛体系结构标签(aarch64 / x86_64) —— 只用来给稳定层
#              tier1(dl)/tier2(工具链)做缓存共享键：同 arch 的不同型号共用一份
#              dl/工具链缓存键，命中率更高（就是"按 arch 合并 tier1"那条优化）。
#   triplet  = 目标三元组，是目录名的一部分 —— build_dir/target-<triplet>
#              必须填对，否则 tier3 命中"无可打包内容"被跳过、等于没生效。
#   device   = 型号名，只进 tier3 的镜像名(...-pkgs-<平台>_<型号>)，
#              让不同型号的易变缓存互不干扰。
#
# 怎么"开箱即用"：
#   - 想编哪些就保留哪些 include 条目，删掉其余即可；只留一条就是单设备编译。
#   - 想加新型号：抄一条 include，改 device / arch / triplet 三个值即可。
#   - 配套脚本 scripts/cache_tiered.sh 原样即可，它完全靠 YAML 注入的 env 工作，不用改一行。
###############################################################################
name: Build_OpenWrt_TieredCache_Runnable带docker

on:
  workflow_dispatch:
    inputs:
      source_code_platform:
        description: '源码平台'
        required: true
        default: 'immortalwrt'
        type: choice
        options: [openwrt, immortalwrt, lede]
      force_rebuild:
        description: '无视缓存纯净重编译'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # checkout / 读写仓库
  packages: write   # 关键：允许向 GHCR 推送 tier3 缓存镜像

env:
  CACHE_ROOT: /workdir
  REPO_PREFIX: openwrt-tiered-cache
  CHUNK_SIZE: 2000M
  ZSTD_LEVEL: 10
  # 工具链层目录与目标三元组无关（host/hostpkg 是"编固件前先造好的本机工具"），
  # 因此这里写成全局固定值、各型号共用。
  TIER2_PATHS: build_dir/host build_dir/hostpkg staging_dir/host staging_dir/hostpkg

jobs:
  build:
    runs-on: ubuntu-latest
    # 一款失败不拖垮其它；想串行可把 fail-fast 设为 true
    strategy:
      fail-fast: false
      matrix:
        # ↓↓↓ 设备档案：删掉不要的条目即可；保留几条就并行编几条 ↓↓↓
        include:
          # RK3566/RK3568 系（R2S/R4S/R5S/R6S/R5C 等 radxa rockchip arm64 板）
          # ARMv8.2 (Cortex-A55) —— rockchip/arm64 的 rk356x subtarget
          - device: r5s
            arch: aarch64
            triplet: aarch64_cortex-a55
            source_repo: https://github.com/immortalwrt/immortalwrt
            branch: master
            # 老 RK33xx(ARMv8.0 Cortex-A53, 如 r2pro/px30) 请把 triplet 改成 aarch64_cortex-a53

          # x86 64 位软路由 / 虚拟机
          - device: x86-64
            arch: x86_64
            triplet: x86_64
            source_repo: https://github.com/immortalwrt/immortalwrt
            branch: master

          # x86 32 位
          - device: x86-generic
            arch: x86
            triplet: i686
            source_repo: https://github.com/immortalwrt/immortalwrt
            branch: master

          # 通用 aarch64 板（无特定 core 优化）
          - device: aarch64-generic
            arch: aarch64
            triplet: aarch64_generic
            source_repo: https://github.com/immortalwrt/immortalwrt
            branch: master

    name: Tiered-${{ inputs.source_code_platform }}-${{ matrix.device }}
    env:
      # 把矩阵里的"档案"透传给脚本：
      #   ARCH 喂给稳定层共享键；DEVICE 喂给 tier3 镜像名；
      #   TIER3_PATHS 用本设备真实三元组拼出 build_dir/target-* 路径。
      SOURCE_CODE_PLATFORM: ${{ inputs.source_code_platform }}
      DEVICE: ${{ matrix.device }}
      ARCH: ${{ matrix.arch }}
      TIER3_PATHS: build_dir/target-${{ matrix.triplet }} staging_dir/target-${{ matrix.triplet }}

    steps:
      # ---- 1. 空间三件套：迁 Docker data-root 到宽敞的 /workdir + 删 Runner 预装大件 ----
      - name: Relocate Docker and Workspace
        run: |
          sudo mkdir -p /workdir
          sudo chown -R $USER:$GROUPS /workdir
          echo '{"data-root":"/workdir/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android || true
          docker system prune -af || true
          docker info | grep "Docker Root Dir"   # 验证 data-root 确实搬过去了
          df -hT

      # ---- 2. 登录 GHCR：push / pull tier3 镜像都需要它 ----
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@v4

      # ---- 3. 克隆源码并软链进工作区；顺手给缓存脚本加执行权限 ----
      - name: Clone Source
        working-directory: /workdir
        run: |
          git clone -b ${{ matrix.branch }} --single-branch ${{ matrix.source_repo }} openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
          chmod +x $GITHUB_WORKSPACE/scripts/cache_tiered.sh

      # ---- 4. 先算三层指纹：指纹进 cache key，决定"命中即零传输"能不能成立 ----
      - name: Fingerprint Stable Tiers
        id: fp
        run: |
          bash $GITHUB_WORKSPACE/scripts/cache_tiered.sh fp tier1
          bash $GITHUB_WORKSPACE/scripts/cache_tiered.sh fp tier2
          bash $GITHUB_WORKSPACE/scripts/cache_tiered.sh fp tier3

      # ---- 5. Actions Cache 还原 tier1(dl)：key 带 arch+指纹；同 arch 命中同一键=零传输 ----
      - name: Restore tier1 dl from Actions Cache
        uses: actions/cache/restore@v4
        with:
          path: /workdir/tiered/tier1
          key: dl-${{ matrix.arch }}-${{ github.ref_name }}-${{ steps.fp.outputs.fp_tier1 }}
          restore-keys: |
            dl-${{ matrix.arch }}-${{ github.ref_name }}-
            dl-${{ matrix.arch }}-

      # ---- 6. 同理还原 tier2(工具链)，键也按 arch 共享 ----
      - name: Restore tier2 toolchain from Actions Cache
        uses: actions/cache/restore@v4
        with:
          path: /workdir/tiered/tier2
          key: tc-${{ matrix.arch }}-${{ github.ref_name }}-${{ steps.fp.outputs.fp_tier2 }}
          restore-keys: |
            tc-${{ matrix.arch }}-${{ github.ref_name }}-
            tc-${{ matrix.arch }}-

      # ---- 7. 逐层还原主逻辑：tier1/tier2 磁盘命中=零传输本地解压；
      #      tier3 回落 GHCR docker cp 逐块取；force_rebuild=clean 全跳过。----
      - name: Restore Cache per Tier
        run: bash $GITHUB_WORKSPACE/scripts/cache_tiered.sh restore ${{ inputs.force_rebuild && 'clean' || 'auto' }}

      # ---- 8. 灌配置：把该平台设备的 .config 复制进去并 defconfig ----
      - name: Make Defconfig
        run: |
          cd openwrt
          CFG="../config/${{ inputs.source_code_platform }}_${{ matrix.device }}.config"
          [ -f "$CFG" ] && cp "$CFG" .config
          make defconfig

      # ---- 9. 编 Base，编译前 touch marker —— gate 差量判定的"锚点"，
      #      之后只有比 marker 更新的 stamp 才算"本轮真编过的包"。----
      - name: Compile Base
        id: base
        run: |
          touch /workdir/base_compilation_marker
          cd openwrt
          make tools/compile -j$(nproc)
          make toolchain/compile -j$(nproc)

      # ---- 10. 限时下载软件包源码：continue-on-error + timeout 防个别包卡死整轮 ----
      - name: Download Packages
        continue-on-error: true
        run: cd openwrt && timeout 25m make package/download -j8

      # ---- 11. 编所有包 + 固件；第 3 次尝试(GHA 自动重试)加 V=s 输出详细日志 ----
      - name: Compile Packages and Firmware
        run: |
          cd openwrt
          V=""
          if [ "${GITHUB_RUN_ATTEMPT}" = "3" ]; then V="V=s"; fi
          make -j$(nproc) $V

      # ---- 12. gate 逐层判定变没变：tier2/tier3 各写独立输出，互不覆盖 ----
      - name: Gate Tiers
        id: gate
        run: |
          bash $GITHUB_WORKSPACE/scripts/cache_tiered.sh gate tier2 /workdir/base_compilation_marker
          bash $GITHUB_WORKSPACE/scripts/cache_tiered.sh gate tier3 /workdir/base_compilation_marker

      # ---- 13. tier2 变了才 repack（否则跳过，稳定层不重复打 tar）----
      - name: Repack tier2 if Changed
        if: steps.gate.outputs.changed_tier2 == '1'
        run: bash $GITHUB_WORKSPACE/scripts/cache_tiered.sh pack tier2 /workdir/tiered/tier2

      # ---- 14. 仅在 tier2 变化时存回 Actions Cache（用当前新指纹做 key，供下轮命中）----
      - name: Save tier2 to Actions Cache
        if: steps.gate.outputs.changed_tier2 == '1'
        uses: actions/cache/save@v4
        with:
          path: /workdir/tiered/tier2
          key: tc-${{ matrix.arch }}-${{ github.ref_name }}-${{ steps.fp.outputs.fp_tier2 }}

      # ---- 15. tier3 变了才打包并推 GHCR（digest 去重：只上传真正改过的分块）----
      - name: Pack and Push tier3 if Changed
        if: steps.gate.outputs.changed_tier3 == '1'
        run: |
          bash $GITHUB_WORKSPACE/scripts/cache_tiered.sh pack tier3 /workdir/tiered/tier3
          bash $GITHUB_WORKSPACE/scripts/cache_tiered.sh image tier3

      # ---- 16. 上传固件产物（bin/targets 下镜像/固件），保留 5 天 ----
      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.source_code_platform }}_${{ matrix.device }}_firmware
          path: openwrt/bin/targets/**/*
          retention-days: 5

###############################################################################
# 如何确认 / 修正你自己的真实三元组（triplet）
# -----------------------------------------------------------------------------
# triplet 决定 build_dir/target-<triplet> 目录名，填错=该型号 tier3 缓存不生效。
#   A) 编一次后看目录：ls openwrt/build_dir/ 里那串 target-xxxxx，去掉前缀即 triplet。
#   B) 看源码 arch 模板 include/target.mk：
#        ARM64_8CORES  -> aarch64_cortex-a53 (ARMv8.0, 如 RK33xx)
#        ARM64_10CORES -> aarch64_cortex-a72
#        ARM64_14CORES -> aarch64_cortex-a55 (ARMv8.2, 如 RK3566/RK3568 系 R5S/R6S)
#        aarch64 通用   -> aarch64_generic    x86 64 -> x86_64    x86 32 -> i686
#   C) 看产物名：bin/targets/<vendor>/<subtarget>/ 里的固件文件名含架构标识。
# ARCH 永远填宽泛值(aarch64/x86_64/x86)，让同架构型号共用 dl/工具链稳定层缓存。
###############################################################################
