name: ImmortalWrt_xiaoyi

on:
  workflow_dispatch:
  #push:
    #branches: [ main ]

permissions:
  contents: write
  actions: write
  packages: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  # WORK_PATH: /home/runner/work/imm/imm/
  SOURCE_DIR: openwrt
  CONFIG_FILE: config/imm_config/86_64.config
  FEEDS_CONF: feeds_config/immortalwrt.feeds.conf.default
  DIY_P1_SH: diy_script/immortalwrt_diy/diy-part1.sh
  DIY_P2_SH: diy_script/immortalwrt_diy/diy-part2.sh
  RELEASE_TAG: immortalwrt-X86
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_ARTIFACT: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check Server Performance
        run: |
          echo "警告: 分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          echo "--------------------------硬盘信息--------------------------"
          df -hT

      - name: Maximize Build Space (Native Hardcore Clean)
        run: |
          sudo umount /mnt || true
          sudo rm -rf /mnt/* || true
          sudo apt-get purge -y mono-complete ghc* google-cloud-sdk azure-cli powershell dotnet* swift* || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/hostedtoolcache || true
          docker system prune -af --volumes || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /tmp/*
          rm -rf ~/.cache/* ~/.npm/* ~/.gradle/*
          echo ">>> 清理完成！当前磁盘状态："
          df -h /

      - name: Create Massive Swap Space
        run: |
          echo ">>> 正在创建 6GB Swap 虚拟内存..."
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 6G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo ">>> Swap 创建成功！"
          free -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://github.com/sxft1978/imm/raw/main/diy_script/immortalwrt_dependence)
          sudo chown $USER:$GROUPS $GITHUB_WORKSPACE
          sudo timedatectl set-timezone "$TZ"
          df -h $pwd

      - name: Clone Source Code (Strict Path)
        working-directory: ${{ github.workspace }}
        run: |
          df -hT $PWD
          git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} ${{ env.SOURCE_DIR }}
          ln -sf ${{ github.workspace }}/${{ env.SOURCE_DIR }} $GITHUB_WORKSPACE/openwrt

      - name: Load Custom Feeds (before cache key)
        run: |
          #[ -e $FEEDS_CONF ] && cp $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          ${{ github.workspace }}/$DIY_P1_SH
          df -hT
      - name: Restore Toolchain Cache
        id: cache-toolchain
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/${{ env.SOURCE_DIR }}/dl
            ${{ github.workspace }}/${{ env.SOURCE_DIR }}/staging_dir
            ${{ github.workspace }}/${{ env.SOURCE_DIR }}/toolchain-*
            ${{ github.workspace }}/${{ env.SOURCE_DIR }}.ccache
          key: immortalwrt-toolchain-${{ runner.os }}-${{ hashFiles('config/imm_config/86_64.config', 'feeds_config/immortalwrt.feeds.conf.default') }}
          restore-keys: |
            immortalwrt-toolchain-${{ runner.os }}-
            
      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          # [ -e files ] && mv files openwrt/files
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          #chmod +x $DIY_P1_SH
          #cd openwrt
          #${{ github.workspace }}/$DIY_P1_SH
          #df -hT

      - name: Get architecture
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          TARGET_DEVICE_ARCH="$(grep "^CONFIG_TARGET_.*=y$" ".config" | head -n 1 | sed 's/^CONFIG_TARGET_//g' | sed 's/=y//g' | awk -F '_' '{print $1}')"
          echo "TARGET_DEVICE_ARCH=${TARGET_DEVICE_ARCH}" >>$GITHUB_ENV
          echo "MIXKEY=X86_64" >>$GITHUB_ENV

      - name: Download package
        id: package
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;
          df -hT $PWD

      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt
          export TARGET_CFLAGS="-fno-stack-protector -U_FORTIFY_SOURCE"
          export TARGET_CPPFLAGS="-U_FORTIFY_SOURCE"
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Check space usage
        if: (!cancelled())
        run: df -hT

      # [改动] 编译完成后始终上传 DL 目录，方便后续复用
      - name: Upload DL folder to Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-x86-dl
          path: ${{ github.workspace }}/openwrt/dl
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6

      # [改动] 编译失败时上传编译日志
      - name: Upload tail log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imm-tail-${{ github.run_id }}
          path: /tmp/imm-build.log
          retention-days: 3

      - name: Upload IMM build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imm-error-${{ github.run_id }}
          path: |
            logs/error.txt
            logs/compile.txt
          retention-days: 3

      - name: Upload compile log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-x86-compile-log
          path: ${{ github.workspace }}/openwrt/compile.log
          retention-days: 7
          if-no-files-found: warn

      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          echo "release_tag=$RELEASE_TAG-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        uses: ncipollo/release-action@v1.14.0
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ steps.tag.outputs.release_tag }}
          bodyFile: "release.txt"
          artifacts: ${{ env.FIRMWARE }}/*
