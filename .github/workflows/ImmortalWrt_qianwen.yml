name: ImmortalWrt_qianwen_严谨版
# ============================================================
# ImmortalWrt x86_64 两阶段编译工作流（注释重写版）
# 本文件只保留 YAML 逻辑本身；所有步骤前的一行注释说明该步骤的功能。
# 文件逻辑与上一版完全一致（runs-on 已统一 ubuntu-24.04、
# 缓存 key 绑定 config+feeds 双哈希、校验步骤实测 gcc -v、
# 仅在工具链真编译成功后保存缓存）。
# ------------------------------------------------------------
# 本轮修改内容：
#   修改1 删除全部旧注释：原 [改动1]~[改动11] 标注、文件头改动清单、
#         以及散落在 run 脚本内部的说明注释，一律清除。
#   修改2 重新逐个 step 写功能说明：每个步骤前一行注释，只讲这一步做什么。
#   修改3 删除 GRUB2 相关步骤：正文中不存在任何 GRUB2 专用编译步骤，
#         旧清单里"新增独立 GRUB2 编译步骤"的声明一并移除；
#         env 中的 FORTIFY_FLAGS 保留（它是作用于全部包的通用编译选项，
#         不是 GRUB2 步骤，删掉会让部分包重新冒出 fortify 报错）。
#   本轮没有改动任何命令、路径、缓存 key、if 条件与产物发布逻辑。
# ============================================================
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  packages: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  WORK_PATH: /home/runner/work/imm/imm/
  SOURCE_DIR: openwrt
  CONFIG_FILE: config/imm_config/86_64.config
  FEEDS_CONF: feeds_config/immortalwrt.feeds.conf.default
  DIY_P1_SH: diy_script/immortalwrt_diy/diy-part1.sh
  DIY_P2_SH: diy_script/immortalwrt_diy/diy-part2.sh
  RELEASE_TAG: immortalwrt-X86
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_ARTIFACT: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  # 抗 fortify 编译选项，经 make 命令行传参统一作用于所有包
  FORTIFY_FLAGS: "-fno-stack-protector -U_FORTIFY_SOURCE"

jobs:
  # 第一阶段：只做环境准备与交叉工具链编译，并把工具链存入缓存供第二阶段复用
  build-toolchain:
    runs-on: ubuntu-22.04
    steps:
      # 打印 CPU/磁盘概况，纯信息提示，便于判断本机算力是否够用。
      - name: Check Server Performance
        run: |
          echo "警告: 分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          echo "--------------------------硬盘信息--------------------------"
          df -hT

      # 卸载 runner 预装的重型软件（android/dotnet/jvm/swift 等）并清空各类缓存目录，为编译腾出磁盘空间。
      - name: Maximize Build Space (Native Hardcore Clean)
        run: |
          sudo umount /mnt || true
          sudo rm -rf /mnt/* || true
          sudo apt-get purge -y mono-complete ghc* google-cloud-sdk azure-cli powershell dotnet* swift* || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/hostedtoolcache || true
          docker system prune -af --volumes || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /tmp/*
          rm -rf ~/.cache/* ~/.npm/* ~/.gradle/*
          echo ">>> 清理完成！当前磁盘状态："
          df -h /

      # 创建 6GB swap 虚拟内存，防止工具链编译阶段因内存不足被 OOM 杀掉。
      - name: Create Massive Swap Space
        run: |
          echo ">>> 正在创建 6GB Swap 虚拟内存..."
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 6G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo ">>> Swap 创建成功！"
          free -h

      # 检出当前仓库，拿到 config、feeds 配置、diy 脚本等工作流依赖文件。
      - name: Checkout
        uses: actions/checkout@v4

      # 安装 OpenWrt 编译所需系统依赖包，修正工作目录权限并设置时区。
      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://github.com/sxft1978/imm/raw/main/diy_script/immortalwrt_dependence)
          sudo chown $USER:$GROUPS $GITHUB_WORKSPACE
          sudo timedatectl set-timezone "$TZ"
          df -hT $PWD

      # 按指定仓库与分支克隆源码到固定路径，并软链接成 openwrt 目录供后续步骤使用。
      - name: Clone Source Code (Strict Path)
        working-directory: ${{ env.WORK_PATH }}
        run: |
          df -hT $PWD
          git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} ${{ env.SOURCE_DIR }}
          ln -sf ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }} $GITHUB_WORKSPACE/openwrt

      # 在计算缓存 key 之前覆盖 feeds.conf.default，使 key 反映真实生效的 feeds 配置。
      - name: Load Custom Feeds (before cache key)
        run: |
          [ -e $FEEDS_CONF ] && cp $FEEDS_CONF openwrt/feeds.conf.default

      # 按 key（config + feeds 双哈希）恢复工具链缓存；设 continue-on-error，缓存服务抖动不中断流程，后续由校验与重编兜底。
      - name: Restore Toolchain Cache
        id: cache-toolchain
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/dl
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/staging_dir
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/build_dir/toolchain-*
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/.ccache
          key: immortalwrt-toolchain-${{ runner.os }}-${{ hashFiles('config/imm_config/86_64.config', 'feeds_config/immortalwrt.feeds.conf.default') }}
          restore-keys: |
            immortalwrt-toolchain-${{ runner.os }}-

      # 刷新 feeds 索引。
      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      # 安装 feeds 中的软件包。
      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      # 仅在缓存报命中时执行：检查 staging_dir 与 build_dir 工具链目录存在且非空，并实际运行一次 gcc -v 确认可执行，结果以 toolchain_ok 输出给下一步。
      - name: Verify Restored Toolchain
        id: verify-toolchain
        if: steps.cache-toolchain.outputs.cache-hit == 'true'
        run: |
          ok=false
          STAGING_DIR=$(ls -d ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/staging_dir/toolchain-*/ 2>/dev/null | head -n 1)
          BUILD_DIR=$(ls -d ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/build_dir/toolchain-*/ 2>/dev/null | head -n 1)
          if [ -n "$STAGING_DIR" ] && [ -n "$BUILD_DIR" ] && [ -n "$(ls -A "$STAGING_DIR" 2>/dev/null)" ]; then
            GCC_BIN=$(find "$STAGING_DIR" -type f -name "*-gcc" | head -n 1)
            if [ -n "$GCC_BIN" ] && "$GCC_BIN" -v >/dev/null 2>&1; then
              ok=true
              echo ">>> 缓存工具链校验通过（已实测 gcc 可执行）: $STAGING_DIR"
            else
              echo ">>> 缓存工具链校验不通过：gcc 缺失或无法执行（宿主库不匹配），按未命中重编"
            fi
          else
            echo ">>> 缓存工具链校验不通过，将判定为未命中并重新编译"
          fi
          echo "toolchain_ok=$ok" >> $GITHUB_OUTPUT
          df -hT

      # 未命中缓存或上一步校验不通过时才编译工具链；先多线程快编，失败自动降级 -j1 V=s 输出详细日志，编译成功写 status=success。
      - name: Build Toolchain (only on cache miss or broken cache)
        id: build-toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true' || steps.verify-toolchain.outputs.toolchain_ok != 'true'
        run: |
          [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
          cd openwrt
          make defconfig
          echo ">>> 缓存未命中或工具链不完整，开始编译工具链: $(nproc) 线程"
          make -j$(nproc) toolchain/install TARGET_CFLAGS="${{ env.FORTIFY_FLAGS }}" TARGET_CPPFLAGS="-U_FORTIFY_SOURCE" \
            || make -j1 V=s toolchain/install TARGET_CFLAGS="${{ env.FORTIFY_FLAGS }}" TARGET_CPPFLAGS="-U_FORTIFY_SOURCE"
          echo "status=success" >> $GITHUB_OUTPUT

      # 只在本轮真正编译工具链成功那一次才保存缓存，避免半截工具链入库；保存失败不阻断本次运行。
      - name: Save Toolchain Cache (only after real success)
        if: steps.build-toolchain.outputs.status == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/dl
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/staging_dir
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/build_dir/toolchain-*
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/.ccache
          key: immortalwrt-toolchain-${{ runner.os }}-${{ hashFiles('config/imm_config/86_64.config', 'feeds_config/immortalwrt.feeds.conf.default') }}

  # 第二阶段：依赖第一阶段，恢复工具链缓存后编译完整固件并发布产物
  build-firmware:
    needs: build-toolchain
    runs-on: ubuntu-24.04
    steps:
      # 打印磁盘概况，纯信息提示。
      - name: Check Server Performance
        run: |
          echo "警告: 分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          df -hT

      # 同第一阶段：卸载预装重型软件并清理缓存，为固件全量编译腾出磁盘空间。
      - name: Maximize Build Space (Native Hardcore Clean)
        run: |
          sudo umount /mnt || true
          sudo rm -rf /mnt/* || true
          sudo apt-get purge -y mono-complete ghc* google-cloud-sdk azure-cli powershell dotnet* swift* || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/hostedtoolcache || true
          docker system prune -af --volumes || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /tmp/*
          rm -rf ~/.cache/* ~/.npm/* ~/.gradle/*
          echo ">>> 清理完成！当前磁盘状态："
          df -h /

      # 同第一阶段：创建 6GB swap，防止内核与软件包全量编译时内存不足。
      - name: Create Massive Swap Space
        run: |
          echo ">>> 正在创建 6GB Swap 虚拟内存..."
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 6G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # 检出当前仓库，取得配置与脚本文件。
      - name: Checkout
        uses: actions/checkout@v4

      # 安装编译依赖包，设置权限与时区。
      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://github.com/sxft1978/imm/raw/main/diy_script/immortalwrt_dependence)
          sudo chown $USER:$GROUPS $GITHUB_WORKSPACE
          sudo timedatectl set-timezone "$TZ"
          df -hT $PWD

      # 克隆源码并软链成 openwrt 目录。
      - name: Clone Source Code (Strict Path)
        working-directory: ${{ env.WORK_PATH }}
        run: |
          df -hT $PWD
          git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} ${{ env.SOURCE_DIR }}
          ln -sf ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }} $GITHUB_WORKSPACE/openwrt

      # 恢复缓存前覆盖 feeds.conf.default，保证与第一阶段 key 计算口径一致。
      - name: Load Custom Feeds (before cache key)
        run: |
          [ -e $FEEDS_CONF ] && cp $FEEDS_CONF openwrt/feeds.conf.default

      # 使用与第一阶段完全相同的 key 与 path，取回第一阶段刚保存的工具链缓存，这是两阶段能衔接复用的关键。
      - name: Restore Toolchain Cache
        id: cache-toolchain
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/dl
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/staging_dir
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/build_dir/toolchain-*
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/.ccache
          key: immortalwrt-toolchain-${{ runner.os }}-${{ hashFiles('config/imm_config/86_64.config', 'feeds_config/immortalwrt.feeds.conf.default') }}
          restore-keys: |
            immortalwrt-toolchain-${{ runner.os }}-

      # 缓存命中后校验工具链完整性，并实测 gcc -v 能否执行，防止"目录在但跑不通"的假通过，结果以 toolchain_ok 输出。
      - name: Verify Restored Toolchain
        id: verify-toolchain
        if: steps.cache-toolchain.outputs.cache-hit == 'true'
        run: |
          ok=false
          STAGING_DIR=$(ls -d ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/staging_dir/toolchain-*/ 2>/dev/null | head -n 1)
          BUILD_DIR=$(ls -d ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/build_dir/toolchain-*/ 2>/dev/null | head -n 1)
          if [ -n "$STAGING_DIR" ] && [ -n "$BUILD_DIR" ] && [ -n "$(ls -A "$STAGING_DIR" 2>/dev/null)" ]; then
            GCC_BIN=$(find "$STAGING_DIR" -type f -name "*-gcc" | head -n 1)
            if [ -n "$GCC_BIN" ] && "$GCC_BIN" -v >/dev/null 2>&1; then
              ok=true
              echo ">>> 缓存工具链校验通过（已实测 gcc 可执行）: $STAGING_DIR"
            else
              echo ">>> 缓存工具链校验不通过：gcc 缺失或无法执行（宿主库不匹配），兜底重编"
            fi
          else
            echo ">>> 缓存工具链校验不通过，将重新编译工具链（兜底，正常情况不应触发）"
          fi
          echo "toolchain_ok=$ok" >> $GITHUB_OUTPUT

      # 刷新 feeds 索引。
      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      # 安装 feeds 中的软件包。
      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      # 兜底重编工具链：正常情况必然跳过，仅当缓存整体失效或恢复出的工具链校验不通过时触发，确保不会用残破工具链编固件。
      - name: Rebuild Toolchain Fallback (only on cache miss or broken cache)
        id: rebuild-toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true' || steps.verify-toolchain.outputs.toolchain_ok != 'true'
        run: |
          cd openwrt
          make defconfig
          echo ">>> 兜底重编工具链: $(nproc) 线程"
          make -j$(nproc) toolchain/install TARGET_CFLAGS="${{ env.FORTIFY_FLAGS }}" TARGET_CPPFLAGS="-U_FORTIFY_SOURCE" \
            || make -j1 V=s toolchain/install TARGET_CFLAGS="${{ env.FORTIFY_FLAGS }}" TARGET_CPPFLAGS="-U_FORTIFY_SOURCE"

      # 把自定义 .config 覆盖到 openwrt/.config，并执行 diy-part2 脚本完成个性化定制。
      - name: Load custom configuration
        run: |
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH
          df -hT

      # 从 .config 解析目标架构（x86 系列），写入环境变量供后续产物命名使用。
      - name: Get architecture
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          TARGET_DEVICE_ARCH="$(grep "^CONFIG_TARGET_.*=y$" ".config" | head -n 1 | sed 's/^CONFIG_TARGET_//g' | sed 's/=y//g' | awk -F '_' '{print $1}')"
          echo "TARGET_DEVICE_ARCH=${TARGET_DEVICE_ARCH}" >>$GITHUB_ENV
          echo "MIXKEY=X86_64" >>$GITHUB_ENV

      # 执行 defconfig 并预下载所有源码包，同时清理下载不完整的坏包文件。
      - name: Download package
        id: package
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;
          df -hT $PWD

      # 全量编译固件（内核、驱动、软件包与镜像），失败时逐级降级重试；成功后提取设备名与时间戳写入环境变量。
      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) TARGET_CFLAGS="${{ env.FORTIFY_FLAGS }}" TARGET_CPPFLAGS="-U_FORTIFY_SOURCE" \
            || make -j1 TARGET_CFLAGS="${{ env.FORTIFY_FLAGS }}" TARGET_CPPFLAGS="-U_FORTIFY_SOURCE" \
            || make -j1 V=s TARGET_CFLAGS="${{ env.FORTIFY_FLAGS }}" TARGET_CPPFLAGS="-U_FORTIFY_SOURCE"
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      # 编译结束后查看磁盘占用情况。
      - name: Check space usage
        if: (!cancelled())
        run: df -hT

      # 无论成败都上传 dl 源码包目录为构建产物，便于复用与排障（保留 7 天）。
      - name: Upload DL folder to Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-x86-dl
          path: ${{ github.workspace }}/openwrt/dl
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6

      # 上传构建日志尾部文件，用于快速定位报错。
      - name: Upload tail log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imm-tail-${{ github.run_id }}
          path: /tmp/imm-build.log
          retention-days: 3

      # 上传 error.txt 与 compile.txt 两类日志文件。
      - name: Upload IMM build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imm-error-${{ github.run_id }}
          path: |
            logs/error.txt
            logs/compile.txt
          retention-days: 3

      # 仅在失败时上传 compile.log 完整编译日志。
      - name: Upload compile log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-x86-compile-log
          path: ${{ github.workspace }}/openwrt/compile.log
          retention-days: 7
          if-no-files-found: warn

      # 按 UPLOAD_BIN_DIR 开关决定是否上传整个 bin 目录。
      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      # 进入固件输出目录，删除 packages 子目录，把固件所在路径写入 FIRMWARE 环境变量。
      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      # 上传整理后的固件目录作为构建产物。
      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      # 按发布前缀加日期时间生成 Release 标签并准备说明文件。
      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          echo "release_tag=$RELEASE_TAG-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      # 创建 GitHub Release，并把固件文件作为附件发布出去。
      - name: Upload firmware to release
        uses: ncipollo/release-action@v1.14.0
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ steps.tag.outputs.release_tag }}
          bodyFile: "release.txt"
          artifacts: ${{ env.FIRMWARE }}/*
