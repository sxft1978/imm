# =====================================================================
# Immor_xiaoyi 三层缓存_Docker加速版 —— 三Job拆分 · final 修复版
#   基于「workflow_三Job拆分_修正版.yml」继续修掉三处根因（编号沿用修复 N1-N6）：
#
#   [N1] tier2/tier3 彻底退出 Actions Cache（几十 GB 一次就撑爆 10GB 共享配额，
#        GitHub 按 LRU 把刚存的连 tier1 一起驱逐——这是 Caches 页只剩 buildkit
#        小条目、第二次跑完全没恢复的直接根因）。改走 Job1 内 GHCR 镜像 push，
#        restore 侧用脚本新子命令 pull 经 docker create+cp 取回归档。
#   [N2] tier1 缓存 key 全部改用稳定输入指纹 fp_key = md5(config+patches)。
#        原版 restore 用编译前 dl 指纹、Job2 保存用编译后指纹 FP_TIER1_END，
#        两次 key 必然不同 -> 永不命中（key 自锁）。
#   [N3] tier2/tier3 的 restore 步骤（原 actions/cache/restore 永 miss）删除，
#        换成 GHCR pull；tier1 cache 未命中时也走 GHCR pull 兜底。
#   [N4] DEVICE_NAME/FILE_DATE 从 $GITHUB_ENV 改为 steps.compile 的 GITHUB_OUTPUT
#        并提升为 Job outputs（原版 meta 里这两项为空，Job3 制品命名连带出错）。
#   [N5] Job3 的 build-push file 改为 docker_ctx 内绝对路径（file 相对 context
#        解析，原 scripts/Dockerfile.firmware 必报 not found）。
#   [N6] 大归档 artifact 只传 tier1（tier2/3 已在 Job1 原地推镜像）；所有
#        artifact 显式 if-no-files-found，失败日志缺失不再把 build 判红进而
#        级联跳过 Job2/Job3。
# =====================================================================

name: Immor_xiaoyi三层缓存_Docker加速版_三Job拆分_final

on:
  workflow_dispatch:
    inputs:
      ssh_between:
        description: '编译后 SSH 调试（是/否）'
        required: false
        default: 'false'
      force_rebuild:
        description: '无视缓存纯净重编译'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  packages: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master

  CONFIG_FILE: config/imm_config/test.config
  FEEDS_CONF: feeds_config/immortalwrt.feeds.conf.default
  DIY_P1_SH: diy_script/immortalwrt_diy/diy-part1.sh
  DIY_P2_SH: diy_script/immortalwrt_diy/diy-part2.sh
  SOURCE_DIR: openwrt

  RELEASE_TAG: immortalwrt-X86
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_ARTIFACT: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

  SOURCE_CODE_PLATFORM: immortalwrt
  DEVICE: xiaoyi_x86
  ARCH: X86_64
  CACHE_VERSION: v4
  CACHE_ROOT: ${{ github.workspace }}/.cache_tiered
  SRC_DIR: ${{ github.workspace }}/openwrt
  CHUNK_SIZE: 2000M
  ZSTD_LEVEL: 3

  TIER1_PATHS: dl
  TIER2_PATHS: build_dir/host build_dir/hostpkg staging_dir/host staging_dir/hostpkg
  TIER3_PATHS: build_dir/target-x86_64_* staging_dir/target-x86_64_*

  DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/immortalwrt-xiaoyi
  REPO_PREFIX: ghcr.io/${{ github.repository_owner }}/immortalwrt-tier-cache

jobs:
  # ==================================================================
  # Job 1：编译 + 原地推 tier2/tier3 镜像（大归档不出本机）
  # ==================================================================
  build:
    runs-on: ubuntu-24.04
    outputs:
      device_name: ${{ steps.compile.outputs.device_name }}
      file_date: ${{ steps.compile.outputs.file_date }}
      fp_key: ${{ steps.fp.outputs.fp_key }}
      ref_name: ${{ github.ref_name }}
    steps:
      - name: Check Server Performance
        run: |
          echo "警告: 分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          df -hT

      - name: Maximize Build Space (Native Hardcore Clean)
        run: |
          sudo umount /mnt || true
          sudo rm -rf /mnt/* || true
          sudo apt-get purge -y mono-complete ghc* google-cloud-sdk azure-cli powershell dotnet* swift* || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/hostedtoolcache || true
          docker system prune -af --volumes || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /tmp/*
          rm -rf ~/.cache/* ~/.npm/* ~/.gradle/*
          echo ">>> 清理完成！当前磁盘状态："
          df -h /

      - name: Create Massive Swap Space
        run: |
          echo ">>> 正在创建 6GB Swap 虚拟内存..."
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 6G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Prep Cache Script & Login GHCR
        run: |
          chmod +x $GITHUB_WORKSPACE/scripts/cache_tiered_x86_test.sh
          mkdir -p "$CACHE_ROOT"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://github.com/sxft1978/imm/raw/main/diy_script/immortalwrt_dependence)
          sudo apt-get -qq install -y zstd ccache
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          sudo timedatectl set-timezone "$TZ"
          df -hT $PWD

      - name: Clone Source Code (Strict Path)
        working-directory: ${{ github.workspace }}
        run: |
          df -hT $PWD
          git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} ${{ env.SOURCE_DIR }}

      - name: Load Custom Feeds (before cache key)
        run: |
          ls
          [ -e files ] && mv files openwrt/
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH
          df -hT

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH
          cat -A feeds.conf 2>/dev/null || echo 'feeds.conf 不存在(正常: 已重命名为 feeds.conf.default)'
          df -hT

      - name: Get architecture
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          TARGET_DEVICE_ARCH="$(grep "^CONFIG_TARGET_.*=y$" ".config" | head -n 1 | sed 's/^CONFIG_TARGET_//g' | sed 's/=y//g' | awk -F '_' '{print $1}')"
          echo "TARGET_DEVICE_ARCH=${TARGET_DEVICE_ARCH}" >>$GITHUB_ENV
          echo "MIXKEY=X86_64" >>$GITHUB_ENV

      # --- 指纹：fp_key 为稳定输入指纹，restore 与 save 两侧共用 [N2] ---
      - name: Fingerprint Stable Tiers
        id: fp
        run: |
          bash $GITHUB_WORKSPACE/scripts/cache_tiered_x86_test.sh fp tier1
          bash $GITHUB_WORKSPACE/scripts/cache_tiered_x86_test.sh fp config
          bash $GITHUB_WORKSPACE/scripts/cache_tiered_x86_test.sh fp patches
          bash $GITHUB_WORKSPACE/scripts/cache_tiered_x86_test.sh fp key

      - name: Restore tier1 dl from Actions Cache
        id: cache_tier1
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CACHE_ROOT }}/tiered/tier1
          key: dl-${{ env.CACHE_VERSION }}-${{ env.ARCH }}-${{ github.ref_name }}-${{ steps.fp.outputs.fp_key }}
          restore-keys: |
            dl-${{ env.CACHE_VERSION }}-${{ env.ARCH }}-${{ github.ref_name }}-
            dl-${{ env.CACHE_VERSION }}-${{ env.ARCH }}-

      # [N3] tier2/tier3 不再走 Actions Cache，改从 GHCR 镜像拉回
      - name: Pull tier2 cache image from GHCR
        run: bash $GITHUB_WORKSPACE/scripts/cache_tiered_x86_test.sh pull tier2

      - name: Pull tier3 cache image from GHCR
        run: bash $GITHUB_WORKSPACE/scripts/cache_tiered_x86_test.sh pull tier3

      # [N3] tier1 的 Actions Cache 未命中时，用 GHCR 兜底
      - name: Pull tier1 cache image from GHCR (fallback)
        if: steps.cache_tier1.outputs.cache-hit != 'true'
        run: bash $GITHUB_WORKSPACE/scripts/cache_tiered_x86_test.sh pull tier1

      - name: Restore Cache per Tier
        run: bash $GITHUB_WORKSPACE/scripts/cache_tiered_x86_test.sh restore ${{ inputs.force_rebuild && 'clean' || 'auto' }}

      - name: Download package
        id: package
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;
          bash $GITHUB_WORKSPACE/scripts/cache_tiered_x86_test.sh touchdl
          df -hT $PWD

      # --- 编译固件：DEVICE_NAME/FILE_DATE 走本步骤 output [N4] ---
      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt
          touch "$CACHE_ROOT/base_compilation_marker"
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "device_name=$(cat DEVICE_NAME)" >> $GITHUB_OUTPUT
          echo "file_date=$(date +"%Y%m%d%H%M")" >> $GITHUB_OUTPUT

      - name: Check space usage
        if: (!cancelled())
        run: df -hT

      - name: Setup SSH debug (optional)
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 15
        if: github.event.inputs.ssh_between == 'true' || github.event.inputs.ssh_between == '是'
        with:
          detached: true

      # --- 缓存变化判定 + 打包 ---
      - name: Gate Tiers
        id: gate
        run: |
          bash $GITHUB_WORKSPACE/scripts/cache_tiered_x86_test.sh gate tier2 "$CACHE_ROOT/base_compilation_marker"
          bash $GITHUB_WORKSPACE/scripts/cache_tiered_x86_test.sh gate tier3 "$CACHE_ROOT/base_compilation_marker"

      - name: Pack all tiers
        id: pack
        run: |
          # 不再对 pack 失败静默 || true：路径缺失脚本自身只 warning，
          # 真失败（tar/压缩出错）必须让 Job 变红暴露，而不是上传空壳。
          bash $GITHUB_WORKSPACE/scripts/cache_tiered_x86_test.sh pack tier1 "$CACHE_ROOT/tiered/tier1"
          bash $GITHUB_WORKSPACE/scripts/cache_tiered_x86_test.sh pack tier2 "$CACHE_ROOT/tiered/tier2"
          bash $GITHUB_WORKSPACE/scripts/cache_tiered_x86_test.sh pack tier3 "$CACHE_ROOT/tiered/tier3"
          bash $GITHUB_WORKSPACE/scripts/cache_tiered_x86_test.sh fp tier1

      # [N1] 大归档原地推镜像，不经 artifact、不占 Actions Cache 配额
      - name: Push tier2 cache image
        if: steps.gate.outputs.changed_tier2 == '1'
        run: bash $GITHUB_WORKSPACE/scripts/cache_tiered_x86_test.sh push tier2

      - name: Push tier3 cache image
        if: steps.gate.outputs.changed_tier3 == '1'
        run: bash $GITHUB_WORKSPACE/scripts/cache_tiered_x86_test.sh push tier3

      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE_ABS=$PWD" >> $GITHUB_ENV
          echo "FIRMWARE_REL=${PWD#$GITHUB_WORKSPACE/}" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      # [N6] 只交棒 tier1 归档（tier2/3 已推镜像），空目录直接报错不再静默
      - name: Upload tier1 archive for backup
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: cache-tier1-${{ github.run_id }}
          path: ${{ env.CACHE_ROOT }}/tiered/tier1
          retention-days: 1
          if-no-files-found: error

      - name: Upload firmware for upload-job
        if: steps.organize.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.run_id }}
          path: ${{ env.FIRMWARE_ABS }}
          retention-days: 1
          if-no-files-found: error

      - name: Write build meta
        run: |
          {
            echo "ARCH=${ARCH}"
            echo "REF_NAME=${GITHUB_REF_NAME}"
            echo "DEVICE_NAME=${{ steps.compile.outputs.device_name }}"
            echo "FILE_DATE=${{ steps.compile.outputs.file_date }}"
            echo "FIRMWARE_REL=${FIRMWARE_REL}"
            echo "FP_TIER1=${{ steps.fp.outputs.fp_tier1 }}"
            echo "FP_CONFIG=${{ steps.fp.outputs.fp_config }}"
            echo "FP_PATCHES=${{ steps.fp.outputs.fp_patches }}"
            echo "FP_KEY=${{ steps.fp.outputs.fp_key }}"
            echo "FP_TIER1_END=${{ steps.pack.outputs.fp_tier1 }}"
            echo "CHANGED_TIER2=${{ steps.gate.outputs.changed_tier2 }}"
            echo "CHANGED_TIER3=${{ steps.gate.outputs.changed_tier3 }}"
          } > $GITHUB_WORKSPACE/build_meta.env
          cat $GITHUB_WORKSPACE/build_meta.env

      - name: Upload build meta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-meta-${{ github.run_id }}
          path: ${{ github.workspace }}/build_meta.env
          retention-days: 1
          if-no-files-found: error

      # --- 失败日志：路径缺失不再把 build 判红（防止级联跳过 Job2/Job3）[N6] ---
      - name: Upload tail log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imm-tail-${{ github.run_id }}
          path: /tmp/imm-build.log
          retention-days: 3
          if-no-files-found: ignore
      - name: Upload IMM build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imm-error-${{ github.run_id }}
          path: |
            logserror.txt
            logscompile.txt
          retention-days: 3
          if-no-files-found: ignore
      - name: Upload compile log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-x86-compile-log
          path: ${{ github.workspace }}/openwrt/compile.log
          retention-days: 7
          if-no-files-found: ignore

  # ==================================================================
  # Job 2：tier1 缓存备份（Actions Cache，key 与 Job1 restore 完全一致 [N2]）
  # ==================================================================
  backup:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Fetch build meta
        uses: actions/download-artifact@v4
        with:
          name: build-meta-${{ github.run_id }}
          path: ${{ github.workspace }}

      - name: Fetch tier1 archive
        uses: actions/download-artifact@v4
        with:
          name: cache-tier1-${{ github.run_id }}
          path: ${{ env.CACHE_ROOT }}/tiered/tier1

      - name: Read meta & Prep script
        run: |
          chmod +x $GITHUB_WORKSPACE/scripts/cache_tiered_x86_test.sh
          set -a; source $GITHUB_WORKSPACE/build_meta.env; set +a
          echo "ARCH=$ARCH" >> $GITHUB_ENV
          echo "REF_NAME=$REF_NAME" >> $GITHUB_ENV
          echo "FP_KEY=$FP_KEY" >> $GITHUB_ENV
          echo ">>> tier1 归档落地情况："
          ls -lh $CACHE_ROOT/tiered/tier1 || true

      - name: Save tier1 to Actions Cache
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CACHE_ROOT }}/tiered/tier1
          key: dl-${{ env.CACHE_VERSION }}-${{ env.ARCH }}-${{ env.REF_NAME }}-${{ env.FP_KEY }}

  # ==================================================================
  # Job 3：上传（固件制品 / Docker 镜像 / Release）
  # ==================================================================
  upload:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Fetch build meta
        uses: actions/download-artifact@v4
        with:
          name: build-meta-${{ github.run_id }}
          path: ${{ github.workspace }}

      - name: Read meta
        run: |
          set -a; source $GITHUB_WORKSPACE/build_meta.env; set +a
          echo "DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV
          echo "FILE_DATE=$FILE_DATE" >> $GITHUB_ENV
          echo "FIRMWARE_REL=$FIRMWARE_REL" >> $GITHUB_ENV

      - name: Fetch firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.run_id }}
          path: ${{ github.workspace }}/firmware_out

      - name: Set firmware path
        run: echo "FIRMWARE=$GITHUB_WORKSPACE/firmware_out" >> $GITHUB_ENV

      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        if: env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: env.UPLOAD_FIRMWARE == 'true'
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Prepare Docker context
        run: |
          ROOTFS="$(find "$GITHUB_WORKSPACE/firmware_out" -name '*rootfs*.tar.gz' | head -n1)"
          echo "找到 rootfs: ${ROOTFS:-无}"
          mkdir -p $GITHUB_WORKSPACE/docker_ctx
          if [ -z "$ROOTFS" ]; then echo "::error::no rootfs tar"; exit 1; fi
          cp "$ROOTFS" "$GITHUB_WORKSPACE/docker_ctx/openwrt-rootfs.tar.gz"
          if [ ! -f "$GITHUB_WORKSPACE/scripts/Dockerfile.firmware" ]; then
            echo "::error::scripts/Dockerfile.firmware missing"; exit 1; fi
          cp "$GITHUB_WORKSPACE/scripts/Dockerfile.firmware" "$GITHUB_WORKSPACE/docker_ctx/Dockerfile.firmware"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build & Push Docker image (GHA layer cache)
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/docker_ctx
          file: ${{ github.workspace }}/docker_ctx/Dockerfile.firmware   # [N5] file 相对 context 解析，必须给 context 内路径
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true'
        run: |
          echo "release_tag=$RELEASE_TAG-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        uses: ncipollo/release-action@v1.14.0
        if: steps.tag.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ steps.tag.outputs.release_tag }}
          bodyFile: "release.txt"
          artifacts: ${{ env.FIRMWARE }}/*
