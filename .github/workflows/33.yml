name: ImmortalWrt-openwrt_x86

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  CONFIG_FILE: config/imm_config/X86.config
  FEEDS_CONF: feeds_config/immortalwrt.feeds.conf.default
  DIY_P1_SH: diy_script/immortalwrt_diy/diy-part1.sh 
  DIY_P2_SH: diy_script/immortalwrt_diy/diy-part2.sh
  RELEASE_TAG: immortalwrt-X86
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_ARTIFACT: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 1000
    steps:    
    - name: Check Server Performance
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT
      
   

    - name: Maximize Build Space (Native Hardcore Clean)
      run: |
          echo ">>> 1. 卸载 Azure 扩展分区，释放隐藏空间..."
          sudo umount /mnt || true
          sudo rm -rf /mnt/* || true
          
          echo ">>> 2. 彻底卸载巨无霸软件 (Mono, Haskell, etc.)..."
          sudo apt-get purge -y \
            mono-complete \
            ghc* \
            google-cloud-sdk \
            azure-cli \
            powershell \
            dotnet* \
            swift* \
            || true
          
          echo ">>> 3. 暴力删除预装的大型开发工具目录..."
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/hostedtoolcache || true
          
          echo ">>> 4. 清理 Docker 镜像和缓存..."
          docker system prune -af --volumes || true
          
          echo ">>> 5. 清理 apt 缓存和用户缓存..."
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /tmp/*
          rm -rf ~/.cache/* ~/.npm/* ~/.gradle/*
          
          echo ">>> 清理完成！当前磁盘状态："
          df -h /

    - name: Create Massive Swap Space
      run: |
          echo ">>> 正在创建 16GB Swap 虚拟内存..."
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo ">>> Swap 创建成功！当前内存状态："
          free -h
    - name: 检查清理后的磁盘空间
      run: |
        echo "清理并挂载 Swap 完成"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Checkout
      uses: actions/checkout@main
      
       
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |             
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://github.com/sxft1976/Openwrt/raw/main/diy_script/immortalwrt_dependence)
        sudo chown $USER:$GROUPS $GITHUB_WORKSPACE
        sudo timedatectl set-timezone "$TZ"
        df -hT $PWD
        pwd
        ls 
                       
    # 【关键】完全复刻你图片的目录操作逻辑
      - name: Clone Source Code (Strict Path)
        run: |
          # 1. 确保父目录存在并进入
          mkdir -p ${{ env.WORK_PATH }}
          cd ${{ env.WORK_PATH }}
          
          # 2. 检查磁盘空间 (对应图片 df -hT)
          df -hT $PWD
          
          # 3. 克隆源码到子目录 (对应图片 git clone ... openwrt)
          git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} ${{ env.SOURCE_DIR }}
          
          # 4. 建立软链接 (对应图片 ln -sf ...)
          # 将源码目录链接到工作区根目录，方便后续步骤调用
          ln -sf ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }} $GITHUB_WORKSPACE/openwrt

      # 恢复之前的编译缓存 (dl, feeds, staging_dir)
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/dl
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/staging_dir
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/.ccache
          key: immortalwrt-toolchain-${{ runner.os }}-${{ hashFiles('**/feeds.conf.default') }}
          restore-keys: |
            immortalwrt-toolchain-${{ runner.os }}-

      # 执行 P1 脚本 (Feeds 更新等)
      - name: Load Custom Feeds & Update
        working-directory: ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}
        run: |
          [ -e $GITHUB_WORKSPACE/feeds.conf.default ] && cp $GITHUB_WORKSPACE/feeds.conf.default feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 【核心】只编译工具链
      - name: Compile Toolchain Only
        working-directory: ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}
        run: |
          # 加载你的配置文件
          [ -e $GITHUB_WORKSPACE/.config ] && cp $GITHUB_WORKSPACE/.config .config
          
          # 执行 make toolchain/install
          make -j$(nproc) toolchain/install

      # 强制保存工具链缓存
      - name: Save Toolchain Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/dl
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/staging_dir
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/.ccache
          key: immortalwrt-toolchain-${{ runner.os }}-${{ hashFiles('**/feeds.conf.default') }}-${{ github.run_id }}
    - name: Get architecture
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        TARGET_DEVICE_ARCH="$(grep "^CONFIG_TARGET_.*=y$" ".config" | head -n 1 | sed 's/^CONFIG_TARGET_//g' | sed 's/=y//g'| awk -F '_' '{print $1}')"
        echo "TARGET_DEVICE_ARCH=${TARGET_DEVICE_ARCH}" >>$GITHUB_ENV
        echo "MIXKEY=X86_64" >>$GITHUB_ENV
        
    - name: cache
      uses: stupidloud/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: ${{ env.MIXKEY }}
        skip: 'true'
        toolchain: 'true'
        clean: 'false'
        prefix: ${{ github.workspace }}/openwrt

         
 
    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
        df -hT $PWD

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$RELEASE_TAG-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        [ ${UPLOAD_GOFILE} = true && ${{ steps.gofile.outputs.url }} ] && echo "🔗 [GoFile](${{ steps.gofile.outputs.url }})" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: ncipollo/release-action@v1.14.0
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: ${{ steps.tag.outputs.release_tag }}
        bodyFile: "release.txt"
        artifacts: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
