name: ImmortalWrt Build (Strict Dir Structure)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: openwrt-24.10
  # 这里严格对应你图片中的 working-directory
  WORK_PATH: /home/runner/work/imm/imm/
  # 对应你图片中 clone 出来的子目录名
  SOURCE_DIR: openwrt

jobs:
  # ==========================================
  # 第一阶段：环境准备 & 编译工具链 (Toolchain)
  # ==========================================
  build-toolchain:
    runs-on: ubuntu-22.04
    steps:
      # 【关键】完全复刻你图片的目录操作逻辑
      - name: Clone Source Code (Strict Path)
        run: |
          # 1. 确保父目录存在并进入
          mkdir -p ${{ env.WORK_PATH }}
          cd ${{ env.WORK_PATH }}
          
          # 2. 检查磁盘空间 (对应图片 df -hT)
          df -hT $PWD
          
          # 3. 克隆源码到子目录 (对应图片 git clone ... openwrt)
          git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} ${{ env.SOURCE_DIR }}
          
          # 4. 建立软链接 (对应图片 ln -sf ...)
          # 将源码目录链接到工作区根目录，方便后续步骤调用
          ln -sf ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }} $GITHUB_WORKSPACE/openwrt

      # 恢复之前的编译缓存 (dl, feeds, staging_dir)
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/dl
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/staging_dir
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/.ccache
          key: immortalwrt-toolchain-${{ runner.os }}-${{ hashFiles('**/feeds.conf.default') }}
          restore-keys: |
            immortalwrt-toolchain-${{ runner.os }}-

      # 执行 P1 脚本 (Feeds 更新等)
      - name: Load Custom Feeds & Update
        working-directory: ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}
        run: |
          [ -e $GITHUB_WORKSPACE/feeds.conf.default ] && cp $GITHUB_WORKSPACE/feeds.conf.default feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 【核心】只编译工具链
      - name: Compile Toolchain Only
        working-directory: ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}
        run: |
          # 加载你的配置文件
          [ -e $GITHUB_WORKSPACE/.config ] && cp $GITHUB_WORKSPACE/.config .config
          
          # 执行 make toolchain/install
          make -j$(nproc) toolchain/install

      # 强制保存工具链缓存
      - name: Save Toolchain Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/dl
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/staging_dir
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/.ccache
          key: immortalwrt-toolchain-${{ runner.os }}-${{ hashFiles('**/feeds.conf.default') }}-${{ github.run_id }}

  # ==========================================
  # 第二阶段：编译完整固件 (Target)
  # ==========================================
  build-firmware:
    needs: build-toolchain
    runs-on: ubuntu-22.04
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget curl

      # 再次执行目录克隆和链接 (因为 Job 之间环境不互通)
      - name: Clone Source Code (Strict Path)
        run: |
          mkdir -p ${{ env.WORK_PATH }}
          cd ${{ env.WORK_PATH }}
          git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} ${{ env.SOURCE_DIR }}
          ln -sf ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }} $GITHUB_WORKSPACE/openwrt

      # 恢复第一阶段保存的工具链缓存
      - name: Restore Toolchain Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/dl
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/staging_dir
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/.ccache
          key: immortalwrt-toolchain-${{ runner.os }}-${{ hashFiles('**/feeds.conf.default') }}-${{ github.run_id }}
          restore-keys: |
            immortalwrt-toolchain-${{ runner.os }}-

      # 执行 P2 脚本 (自定义配置等)
      - name: Load Custom Configuration
        working-directory: ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}
        run: |
          [ -e $GITHUB_WORKSPACE/files ] && mv $GITHUB_WORKSPACE/files files
          [ -e $GITHUB_WORKSPACE/.config ] && cp $GITHUB_WORKSPACE/.config .config
          # 如果有 diy-part2.sh，在这里执行
          # bash $GITHUB_WORKSPACE/diy-part2.sh

      # 编译完整固件
      - name: Compile Firmware
        working-directory: ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}
        run: |
          make -j$(nproc) || make -j1 V=s

      # 上传固件
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-Firmware
          path: ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/bin/targets/
