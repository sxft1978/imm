name: ImmortalWrt Build (Strict Dir Structure)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: openwrt-24.10
  WORK_PATH: /home/runner/work/imm/imm/
  SOURCE_DIR: openwrt
  CONFIG_FILE: config/imm_config/X86.config
  FEEDS_CONF: feeds_config/immortalwrt.feeds.conf.default
  DIY_P1_SH: diy_script/immortalwrt_diy/diy-part1.sh
  DIY_P2_SH: diy_script/immortalwrt_diy/diy-part2.sh
  RELEASE_TAG: immortalwrt-X86
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_ARTIFACT: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  # ==========================================
  # 第一阶段：环境准备 & 编译工具链 (Toolchain)
  # ==========================================
  build-toolchain:
    runs-on: ubuntu-22.04
    steps:
      - name: Check Server Performance
        run: |
          echo "警告⚠"
          echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
          echo "--------------------------CPU信息--------------------------"
          echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
          echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
          echo "--------------------------内存信息--------------------------"
          echo "已安装内存详细信息："
          echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
          echo "--------------------------硬盘信息--------------------------"
          echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

      - name: Maximize Build Space (Native Hardcore Clean)
        run: |
          echo ">>> 1. 卸载 Azure 扩展分区，释放隐藏空间..."
          sudo umount /mnt || true
          sudo rm -rf /mnt/* || true
          echo ">>> 2. 彻底卸载巨无霸软件 (Mono, Haskell, etc.)..."
          sudo apt-get purge -y \
          mono-complete \
          ghc* \
          google-cloud-sdk \
          azure-cli \
          powershell \`
          dotnet* \
          swift* \
          || true

          echo ">>> 3. 暴力删除预装的大型开发工具目录..."
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/hostedtoolcache || true
          echo ">>> 4. 清理 Docker 镜像和缓存..."
          docker system prune -af --volumes || true

          echo ">>> 5. 清理 apt 缓存和用户缓存..."
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /tmp/*
          rm -rf ~/.cache/* ~/.npm/* ~/.gradle/*

          echo ">>> 清理完成！当前磁盘状态："
          df -h /

      - name: Create Massive Swap Space
        run: |
          echo ">>> 正在创建 6GB Swap 虚拟内存..."
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 6G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo ">>> Swap 创建成功！当前内存状态："
          free -h
      - name: 检查清理后的磁盘空间
        run: |
          echo "清理并挂载 Swap 完成"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      - name: Checkout
        uses: actions/checkout@main

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://github.com/sxft1978/openwrt/raw/main/diy_script/immortalwrt_dependence)
          sudo chown $USER:$GROUPS $GITHUB_WORKSPACE
          sudo timedatectl set-timezone "$TZ"
          df -hT $PWD
          pwd
          ls

      # 【关键】完全复刻你图片的目录操作逻辑
      - name: Clone Source Code (Strict Path)
        run: |
          # 1. 确保父目录存在并进入
          mkdir -p ${{ env.WORK_PATH }}
          cd ${{ env.WORK_PATH }}
          
          # 2. 检查磁盘空间 (对应图片 df -hT)
          df -hT $PWD
          
          # 3. 克隆源码到子目录 (对应图片 git clone ... openwrt)
          git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} ${{ env.SOURCE_DIR }}
          
          # 4. 建立软链接 (对应图片 ln -sf ...)
          # 将源码目录链接到工作区根目录，方便后续步骤调用
          ln -sf ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }} $GITHUB_WORKSPACE/openwrt

      # 恢复之前的编译缓存 (dl, feeds, staging_dir)
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/dl
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/staging_dir
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/.ccache
          key: immortalwrt-toolchain-${{ runner.os }}-${{ hashFiles('**/feeds.conf.default') }}
          restore-keys: |
            immortalwrt-toolchain-${{ runner.os }}-

      # 执行 P1 脚本 (Feeds 更新等)
      - name: Load Custom Feeds & Update
        working-directory: ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}
        run: |
          [ -e $GITHUB_WORKSPACE/feeds.conf.default ] && cp $GITHUB_WORKSPACE/feeds.conf.default feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 【核心】只编译工具链
      - name: Compile Toolchain Only
        working-directory: ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}
        run: |
          # 加载你的配置文件
          [ -e $GITHUB_WORKSPACE/.config ] && cp $GITHUB_WORKSPACE/.config .config
          
          # 执行 make toolchain/install
          make -j1 toolchain/install

      # 强制保存工具链缓存
      - name: Save Toolchain Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/dl
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/staging_dir
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/.ccache
          key: immortalwrt-toolchain-${{ runner.os }}-${{ hashFiles('**/feeds.conf.default') }}-${{ github.run_id }}

  # ==========================================
  # 第二阶段：编译完整固件 (Target)
  # ==========================================
  build-firmware:
    needs: build-toolchain
    runs-on: ubuntu-22.04
    steps:
      - name: Check Server Performance
        run: |
          echo "警告⚠"
          echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
          echo "--------------------------CPU信息--------------------------"
          echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
          echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
          echo "--------------------------内存信息--------------------------"
          echo "已安装内存详细信息："
          echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
          echo "--------------------------硬盘信息--------------------------"
          echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

      - name: Maximize Build Space (Native Hardcore Clean)
        run: |
          echo ">>> 1. 卸载 Azure 扩展分区，释放隐藏空间..."
          sudo umount /mnt || true
          sudo rm -rf /mnt/* || true
          echo ">>> 2. 彻底卸载巨无霸软件 (Mono, Haskell, etc.)..."
          sudo apt-get purge -y \
          mono-complete \
          ghc* \
          google-cloud-sdk \
          azure-cli \
          powershell \`
          dotnet* \
          swift* \
          || true

          echo ">>> 3. 暴力删除预装的大型开发工具目录..."
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/hostedtoolcache || true
          echo ">>> 4. 清理 Docker 镜像和缓存..."
          docker system prune -af --volumes || true

          echo ">>> 5. 清理 apt 缓存和用户缓存..."
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /tmp/*
          rm -rf ~/.cache/* ~/.npm/* ~/.gradle/*

          echo ">>> 清理完成！当前磁盘状态："
          df -h /

      - name: Create Massive Swap Space
        run: |
          echo ">>> 正在创建 6GB Swap 虚拟内存..."
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 6G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo ">>> Swap 创建成功！当前内存状态："
          free -h
      - name: 检查清理后的磁盘空间
        run: |
          echo "清理并挂载 Swap 完成"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      - name: Checkout
        uses: actions/checkout@main

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://github.com/sxft1978/openwrt/raw/main/diy_script/immortalwrt_dependence)
          sudo chown $USER:$GROUPS $GITHUB_WORKSPACE
          sudo timedatectl set-timezone "$TZ"
          df -hT $PWD
          pwd
          ls

      # 再次执行目录克隆和链接 (因为 Job 之间环境不互通)
      - name: Clone Source Code (Strict Path)
        run: |
          mkdir -p ${{ env.WORK_PATH }}
          cd ${{ env.WORK_PATH }}
          git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} ${{ env.SOURCE_DIR }}
          ln -sf ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }} $GITHUB_WORKSPACE/openwrt

      # 恢复第一阶段保存的工具链缓存
      - name: Restore Toolchain Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/dl
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/staging_dir
            ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/.ccache
          key: immortalwrt-toolchain-${{ runner.os }}-${{ hashFiles('**/feeds.conf.default') }}-${{ github.run_id }}
          restore-keys: |
            immortalwrt-toolchain-${{ runner.os }}-

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          [ -e files ] && mv files openwrt/files
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt        
          $GITHUB_WORKSPACE/$DIY_P2_SH 
          df -hT
      

      # 编译完整固件
      - name: Compile Firmware
        working-directory: ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}
        run: |
          make -j$(nproc) || make -j1 V=s

      # 上传固件
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-Firmware
          path: ${{ env.WORK_PATH }}/${{ env.SOURCE_DIR }}/bin/targets/
