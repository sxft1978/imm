name: Imm_xiaoyi

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  packages: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  SOURCE_DIR: openwrt
  CONFIG_FILE: config/imm_config/86_64.config
  FEEDS_CONF: feeds_config/immortalwrt.feeds.conf.default
  DIY_P1_SH: diy_script/immortalwrt_diy/diy-part1.sh
  DIY_P2_SH: diy_script/immortalwrt_diy/diy-part2.sh
  RELEASE_TAG: immortalwrt-X86
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_ARTIFACT: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # ========== 环境准备 ==========
      - name: Check Server Performance
        run: |
          echo "警告: 分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          echo "--------------------------硬盘信息--------------------------"
          df -hT

      - name: Maximize Build Space (Native Hardcore Clean)
        run: |
          sudo umount /mnt || true
          sudo rm -rf /mnt/* || true
          sudo apt-get purge -y mono-complete ghc* google-cloud-sdk azure-cli powershell dotnet* swift* || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/hostedtoolcache || true
          docker system prune -af --volumes || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /tmp/*
          rm -rf ~/.cache/* ~/.npm/* ~/.gradle/*
          echo ">>> 清理完成！当前磁盘状态："
          df -h /

      - name: Create Massive Swap Space
        run: |
          echo ">>> 正在创建 6GB Swap 虚拟内存..."
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 6G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo ">>> Swap 创建完成："
          free -h

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-pip python3-setuptools rsync swig unzip zlib1g-dev file wget curl
          sudo timedatectl set-timezone "$TZ"

      # ========== 克隆源码 ==========
      - name: Clone Source Code
        run: |
          git clone $REPO_URL -b $REPO_BRANCH $SOURCE_DIR

      # ========== 恢复缓存 ==========
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/${{ env.SOURCE_DIR }}/dl
            ${{ github.workspace }}/${{ env.SOURCE_DIR }}/staging_dir
            ${{ github.workspace }}/${{ env.SOURCE_DIR }}/.ccache
          key: immortalwrt-toolchain-${{ runner.os }}-${{ github.sha }}-${{ hashFiles('X86.config', 'feeds_config/immortalwrt.feeds.conf.default', 'diy_script/immortalwrt_diy/diy-part1.sh', 'diy_script/immortalwrt_diy/diy-part2.sh') }}
          restore-keys: |
            immortalwrt-toolchain-${{ runner.os }}-

      # ========== 加载自定义 feeds ==========
      - name: Load Custom Feeds
        run: |
          [ -e $FEEDS_CONF ] && cp $FEEDS_CONF $SOURCE_DIR/feeds.conf.default

      # ========== 更新 feeds ==========
      - name: Update Feeds
        run: |
          cd $SOURCE_DIR
          ./scripts/feeds update -a

      # ========== 安装 feeds ==========
      - name: Install Feeds
        run: |
          cd $SOURCE_DIR
          ./scripts/feeds install -a

      # ========== DIY Part 1 ==========
      - name: Run DIY Part 1
        run: |
          [ -e $DIY_P1_SH ] && bash $DIY_P1_SH

      # ========== 加载配置 ==========
      - name: Load Custom Configuration
        run: |
          [ -e $CONFIG_FILE ] && cp $CONFIG_FILE $SOURCE_DIR/.config

      # ========== 编译工具链 ==========
      - name: Build Toolchain
        run: |
          cd $SOURCE_DIR
          make defconfig
          make toolchain/install -j$(nproc)

      # ========== 上传工具链到 Artifact ==========
      - name: Upload Toolchain to Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-${{ github.sha }}
          path: |
            ${{ github.workspace }}/${{ env.SOURCE_DIR }}/staging_dir
            ${{ github.workspace }}/${{ env.SOURCE_DIR }}/.ccache
          retention-days: 30

      # ========== 下载 DL 包 ==========
      - name: Download DL Packages
        run: |
          cd $SOURCE_DIR
          make download -j$(nproc)

      # ========== 上传 DL 包到 Artifact ==========
      - name: Upload DL Packages to Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dl-packages-${{ github.sha }}
          path: |
            ${{ github.workspace }}/${{ env.SOURCE_DIR }}/dl
          retention-days: 30

      # ========== 上传 DL 包到 Release ==========
      - name: Upload DL Packages to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}-dl
          files: |
            ${{ github.workspace }}/${{ env.SOURCE_DIR }}/dl
          name: DL Packages
          body: |
            DL 依赖包（${{ github.sha }}）
          draft: false
          prerelease: false

      # ========== DIY Part 2 ==========
      - name: Run DIY Part 2
        run: |
          [ -e $DIY_P2_SH ] && bash $DIY_P2_SH

      # ========== 编译固件 ==========
      - name: Build Firmware
        run: |
          cd $SOURCE_DIR
          make -j$(nproc) || make -j1 V=s

      # ========== 保存缓存 ==========
      - name: Save Cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}/${{ env.SOURCE_DIR }}/dl
            ${{ github.workspace }}/${{ env.SOURCE_DIR }}/staging_dir
            ${{ github.workspace }}/${{ env.SOURCE_DIR }}/.ccache
          key: immortalwrt-toolchain-${{ runner.os }}-${{ github.sha }}-${{ hashFiles('X86.config', 'feeds_config/immortalwrt.feeds.conf.default', 'diy_script/immortalwrt_diy/diy-part1.sh', 'diy_script/immortalwrt_diy/diy-part2.sh') }}

      # ========== 上传固件 ==========
      - name: Upload Firmware to Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            ${{ github.workspace }}/${{ env.SOURCE_DIR }}/bin/targets/**/*
          retention-days: 30

      - name: Upload Firmware to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ github.workspace }}/${{ env.SOURCE_DIR }}/bin/targets/**/*
          name: ImmortalWrt X86 Firmware
          body: |
            ImmortalWrt X86 固件（${{ github.sha }}）
          draft: false
          prerelease: false
