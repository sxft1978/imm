name: 清理旧Runs and Releases

on:
  schedule:
    - cron: '0 0 * * *'   # 每天北京时间 08:00 自动执行，可按需改
  workflow_dispatch:
    inputs:
      keep_runs:
        description: "保留最近多少条工作流运行记录"
        required: false
        default: "10"
        type: string
      keep_releases:
        description: "保留最近多少个 Release / Tag"
        required: false
        default: "3"
        type: string

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KEEP_RUNS: ${{ inputs.keep_runs || '10' }}
        run: |
          gh run list --limit 200 --json databaseId \
            --jq '.[].databaseId' \
            | tail -n +"$(( KEEP_RUNS + 1 ))" \
            | xargs -r -I {} gh run delete {}

      - name: Cleanup old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KEEP_RELEASES: ${{ inputs.keep_releases || '3' }}
        run: |
          gh release list --limit 200 --json name \
            --jq '.[].name' \
            | tail -n +"$(( KEEP_RELEASES + 1 ))" \
            | xargs -r -I {} gh release delete {} -y

      - name: Cleanup old remote tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KEEP_RELEASES: ${{ inputs.keep_releases || '3' }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 保留最近 N 个 Release 对应的 Tag
          KEEP_TAGS=$(
            gh release list --limit 200 --json tagName \
              --jq '.[].tagName' \
              | head -n "$KEEP_RELEASES"
          )

          # 获取远端所有 Tag
          ALL_TAGS=$(gh api "repos/$GH_REPO/tags?per_page=100" --paginate --jq '.[].name')

          # 删除不在保留列表里的 Tag
          echo "$ALL_TAGS" | while read -r TAG; do
            if [ -z "$TAG" ]; then
              continue
            fi
            if echo "$KEEP_TAGS" | grep -qxF "$TAG"; then
              continue
            fi
            echo "Deleting tag: $TAG"
            git tag -d "$TAG" || true
            git push origin --delete "$TAG" || true
          done
