name: Cleanup Old Runs and Releases

on:
  schedule:
    - cron: '0 0 * * *'   # 每天北京时间 08:00 自动执行，可按需改
  workflow_dispatch:
    inputs:
      keep_runs:
        description: "保留最近多少条工作流运行记录"
        required: false
        default: "10"
        type: string
      keep_releases:
        description: "保留最近多少个 Release"
        required: false
        default: "3"
        type: string

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KEEP_RUNS: ${{ inputs.keep_runs || '10' }}
        run: |
          gh run list --limit 200 --json databaseId \
            --jq '.[].databaseId' \
            | tail -n +"$(( KEEP_RUNS + 1 ))" \
            | xargs -r -I {} gh run delete {}

      - name: Cleanup old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KEEP_RELEASES: ${{ inputs.keep_releases || '3' }}
        run: |
          gh release list --limit 200 --json name \
            --jq '.[].name' \
            | tail -n +"$(( KEEP_RELEASES + 1 ))" \
            | xargs -r -I {} gh release delete {} -y

      - name: Cleanup orphaned remote tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 1. 获取远端所有 Tag 名称
          ALL_TAGS=$(gh api repos/$GH_REPO/tags --paginate --jq '.[].name')
          
          # 2. 获取所有当前存在的 Release 对应的 Tag
          RELEASE_TAGS=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          
          # 3. 找出在 ALL_TAGS 中但不在 RELEASE_TAGS 中的 Tag（即孤立 Tag）
          ORPHAN_TAGS=$(comm -23 <(echo "$ALL_TAGS" | sort) <(echo "$RELEASE_TAGS" | sort))
          
          # 4. 循环删除孤立的远端 Tag
          if [ -z "$ORPHAN_TAGS" ]; then
            echo "No orphaned tags to delete."
          else
            echo "Deleting orphaned tags:"
            echo "$ORPHAN_TAGS" | while read -r TAG; do
              echo "  -> $TAG"
              git push origin --delete "$TAG" || true
            done
          fi
